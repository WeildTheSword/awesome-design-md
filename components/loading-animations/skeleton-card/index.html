<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Skeleton Card</title>
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { height: 100%; }
    body { min-height: 100%; display: flex; align-items: center; justify-content: center; background: #0a0a0a; overflow: hidden; }

    .card {
      width: 240px;
      background: #111;
      border-radius: 12px;
      overflow: hidden;
    }

    .shimmer {
      background: linear-gradient(110deg, #1a1a1a 30%, #222 50%, #1a1a1a 70%);
      background-size: 200% 100%;
      animation: shimmer 1.5s linear infinite;
    }

    .image {
      width: 100%;
      height: 150px;
    }

    .text-area {
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .text-line {
      height: 12px;
      border-radius: 6px;
    }

    .text-line:nth-child(1) { width: 90%; }
    .text-line:nth-child(2) { width: 65%; }

    @keyframes shimmer {
      0% { background-position: 200% 0; }
      100% { background-position: -200% 0; }
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="image shimmer"></div>
    <div class="text-area">
      <div class="text-line shimmer"></div>
      <div class="text-line shimmer"></div>
    </div>
  </div>
</body>
</html>
