<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Fill Bar</title>
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { height: 100%; }
    body { min-height: 100%; display: flex; align-items: center; justify-content: center; background: #0a0a0a; overflow: hidden; }

    .fill-bar {
      width: 200px;
      height: 6px;
      background: #222;
      border-radius: 3px;
      overflow: hidden;
      position: relative;
    }

    .fill-bar::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      height: 100%;
      width: 100%;
      background: linear-gradient(90deg, #00ff88, #0088ff);
      border-radius: 3px;
      transform: scaleX(0);
      transform-origin: left;
      animation: fill 2s ease-in-out infinite;
    }

    @keyframes fill {
      0% { transform: scaleX(0); }
      80% { transform: scaleX(1); }
      100% { transform: scaleX(0); }
    }
  </style>
</head>
<body>
  <div class="fill-bar"></div>
</body>
</html>
