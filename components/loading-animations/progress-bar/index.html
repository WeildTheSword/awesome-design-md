<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Progress Bar</title>
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { height: 100%; }
    body { min-height: 100%; display: flex; align-items: center; justify-content: center; background: #0a0a0a; overflow: hidden; }

    .bar {
      width: 200px;
      height: 4px;
      background: #222;
      border-radius: 2px;
      overflow: hidden;
      position: relative;
    }

    .bar::before {
      content: '';
      position: absolute;
      inset: 0;
      background: #00ff88;
      animation: fill 2s ease-in-out infinite;
      transform-origin: left;
    }

    .bar::after {
      content: '';
      position: absolute;
      top: 0;
      left: -50%;
      width: 50%;
      height: 100%;
      background: linear-gradient(90deg, transparent, rgba(255,255,255,0.3), transparent);
      animation: shimmer 2s ease-in-out infinite;
    }

    @keyframes fill {
      0% { transform: scaleX(0); }
      100% { transform: scaleX(1); }
    }

    @keyframes shimmer {
      0% { left: -50%; }
      100% { left: 150%; }
    }
  </style>
</head>
<body>
  <div class="bar"></div>
</body>
</html>
