<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Loading Wave Bar</title>
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { height: 100%; }
    body { min-height: 100%; display: flex; align-items: center; justify-content: center; background: #0a0a0a; overflow: hidden; }

    .wave-bar {
      width: 200px;
      height: 4px;
      border-radius: 2px;
      background: linear-gradient(90deg, #222 25%, #00ff88 50%, #222 75%);
      background-size: 200% 100%;
      animation: wave 1.5s linear infinite;
    }

    @keyframes wave {
      0% { background-position: 200% 0; }
      100% { background-position: -200% 0; }
    }
  </style>
</head>
<body>
  <div class="wave-bar"></div>
</body>
</html>
