<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Content Placeholder</title>
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { height: 100%; }
    body { min-height: 100%; display: flex; align-items: center; justify-content: center; background: #0a0a0a; overflow: hidden; }

    .placeholder {
      width: 320px;
      display: flex;
      gap: 16px;
    }

    .text-col {
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .shimmer {
      background: linear-gradient(110deg, #1a1a1a 30%, #222 50%, #1a1a1a 70%);
      background-size: 200% 100%;
      animation: shimmer 1.5s linear infinite;
      border-radius: 6px;
    }

    .heading {
      height: 18px;
      width: 100%;
    }

    .body-line {
      height: 10px;
    }

    .body-line:nth-child(2) { width: 100%; }
    .body-line:nth-child(3) { width: 90%; }
    .body-line:nth-child(4) { width: 75%; }

    .image {
      width: 70px;
      height: 70px;
      border-radius: 8px;
      flex-shrink: 0;
      align-self: flex-start;
    }

    @keyframes shimmer {
      0% { background-position: 200% 0; }
      100% { background-position: -200% 0; }
    }
  </style>
</head>
<body>
  <div class="placeholder">
    <div class="text-col">
      <div class="heading shimmer"></div>
      <div class="body-line shimmer"></div>
      <div class="body-line shimmer"></div>
      <div class="body-line shimmer"></div>
    </div>
    <div class="image shimmer"></div>
  </div>
</body>
</html>
