<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Step Progress</title>
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { height: 100%; }
    body { min-height: 100%; display: flex; align-items: center; justify-content: center; background: #0a0a0a; overflow: hidden; }

    .steps {
      display: flex;
      align-items: center;
      gap: 0;
    }

    .step {
      width: 20px;
      height: 20px;
      border-radius: 50%;
      background: #333;
      position: relative;
    }

    .line {
      width: 30px;
      height: 3px;
      background: #333;
      position: relative;
      overflow: hidden;
    }

    .line::after {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      height: 100%;
      width: 100%;
      background: #00ff88;
      transform: scaleX(0);
      transform-origin: left;
    }

    .step:nth-child(1) { animation: fillStep 4s infinite; animation-delay: 0s; }
    .line:nth-child(2)::after { animation: fillLine 4s infinite; animation-delay: 0.5s; }
    .step:nth-child(3) { animation: fillStep 4s infinite; animation-delay: 1s; }
    .line:nth-child(4)::after { animation: fillLine 4s infinite; animation-delay: 1.5s; }
    .step:nth-child(5) { animation: fillStep 4s infinite; animation-delay: 2s; }
    .line:nth-child(6)::after { animation: fillLine 4s infinite; animation-delay: 2.5s; }
    .step:nth-child(7) { animation: fillStep 4s infinite; animation-delay: 3s; }

    @keyframes fillStep {
      0%, 10% { background: #333; }
      15%, 85% { background: #00ff88; }
      95%, 100% { background: #333; }
    }

    @keyframes fillLine {
      0%, 5% { transform: scaleX(0); }
      15%, 85% { transform: scaleX(1); }
      95%, 100% { transform: scaleX(0); }
    }
  </style>
</head>
<body>
  <div class="steps">
    <div class="step"></div>
    <div class="line"></div>
    <div class="step"></div>
    <div class="line"></div>
    <div class="step"></div>
    <div class="line"></div>
    <div class="step"></div>
  </div>
</body>
</html>
