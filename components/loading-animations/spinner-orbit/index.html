<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Spinner Orbit</title>
<style>
  *, *::before, *::after {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }

  body {
    background: #0a0a0a;
    height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  }

  .orbit-spinner {
    position: relative;
    width: 56px;
    height: 56px;
  }

  .orbit-dot {
    position: absolute;
    width: 100%;
    height: 100%;
    top: 0;
    left: 0;
    animation: orbit-rotate 1.4s cubic-bezier(0.5, 0, 0.5, 1) infinite;
  }

  .orbit-dot::before {
    content: '';
    position: absolute;
    top: 0;
    left: 50%;
    transform: translateX(-50%);
    border-radius: 50%;
    background: #00ff88;
    width: 8px;
    height: 8px;
  }

  .orbit-dot:nth-child(1) {
    animation-delay: 0s;
  }
  .orbit-dot:nth-child(1)::before {
    opacity: 1;
    box-shadow: 0 0 8px rgba(0, 255, 136, 0.4);
  }

  .orbit-dot:nth-child(2) {
    animation-delay: -0.2s;
  }
  .orbit-dot:nth-child(2)::before {
    opacity: 0.6;
  }

  .orbit-dot:nth-child(3) {
    animation-delay: -0.4s;
  }
  .orbit-dot:nth-child(3)::before {
    opacity: 0.3;
  }

  @keyframes orbit-rotate {
    0% { transform: rotate(0deg); }
    100% { transform: rotate(360deg); }
  }
</style>
</head>
<body>
  <div class="orbit-spinner">
    <div class="orbit-dot"></div>
    <div class="orbit-dot"></div>
    <div class="orbit-dot"></div>
  </div>
</body>
</html>
