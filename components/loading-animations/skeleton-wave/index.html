<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Skeleton Wave</title>
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { height: 100%; }
    body { min-height: 100%; display: flex; align-items: center; justify-content: center; background: #0a0a0a; overflow: hidden; }

    .skeleton {
      display: flex;
      flex-direction: column;
      gap: 12px;
      width: 260px;
    }

    .line {
      height: 12px;
      border-radius: 6px;
      background: linear-gradient(110deg, #1a1a1a 30%, #222 50%, #1a1a1a 70%);
      background-size: 200% 100%;
      animation: shimmer 1.5s linear infinite;
    }

    .line:nth-child(1) { width: 100%; }
    .line:nth-child(2) { width: 80%; }
    .line:nth-child(3) { width: 60%; }

    @keyframes shimmer {
      0% { background-position: 200% 0; }
      100% { background-position: -200% 0; }
    }
  </style>
</head>
<body>
  <div class="skeleton">
    <div class="line"></div>
    <div class="line"></div>
    <div class="line"></div>
  </div>
</body>
</html>
