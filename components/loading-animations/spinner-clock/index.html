<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Spinner Clock</title>
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { height: 100%; }
    body { min-height: 100%; display: flex; align-items: center; justify-content: center; background: #0a0a0a; overflow: hidden; }

    .clock {
      width: 40px;
      height: 40px;
      border: 3px solid #e2e8f0;
      border-radius: 50%;
      position: relative;
    }

    .clock::after {
      content: '';
      position: absolute;
      top: 50%;
      left: 50%;
      width: 2px;
      height: 40%;
      background: #00ff88;
      transform-origin: bottom center;
      transform: translateX(-50%) translateY(-100%);
      animation: sweep 2s linear infinite;
    }

    @keyframes sweep {
      to { transform: translateX(-50%) translateY(-100%) rotate(360deg); }
    }
  </style>
</head>
<body>
  <div class="clock"></div>
</body>
</html>
