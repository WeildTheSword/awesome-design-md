<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Skeleton Table</title>
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { height: 100%; }
    body { min-height: 100%; display: flex; align-items: center; justify-content: center; background: #0a0a0a; overflow: hidden; }

    .table {
      display: flex;
      flex-direction: column;
      gap: 10px;
      width: 300px;
    }

    .row {
      display: flex;
      gap: 10px;
    }

    .cell {
      flex: 1;
      height: 16px;
      border-radius: 8px;
      background: linear-gradient(110deg, #1a1a1a 30%, #222 50%, #1a1a1a 70%);
      background-size: 200% 100%;
      animation: shimmer 1.5s linear infinite;
    }

    .row:nth-child(2) .cell { animation-delay: 0.1s; }
    .row:nth-child(3) .cell { animation-delay: 0.2s; }
    .row:nth-child(4) .cell { animation-delay: 0.3s; }

    @keyframes shimmer {
      0% { background-position: 200% 0; }
      100% { background-position: -200% 0; }
    }
  </style>
</head>
<body>
  <div class="table">
    <div class="row"><div class="cell"></div><div class="cell"></div><div class="cell"></div></div>
    <div class="row"><div class="cell"></div><div class="cell"></div><div class="cell"></div></div>
    <div class="row"><div class="cell"></div><div class="cell"></div><div class="cell"></div></div>
    <div class="row"><div class="cell"></div><div class="cell"></div><div class="cell"></div></div>
  </div>
</body>
</html>
