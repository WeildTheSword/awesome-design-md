<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Avatar Group Skeleton</title>
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { height: 100%; }
    body { min-height: 100%; display: flex; align-items: center; justify-content: center; background: #0a0a0a; overflow: hidden; }

    .avatar-group {
      display: flex;
    }

    .avatar {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      background: #1a1a1a;
      border: 2px solid #0a0a0a;
      animation: pulse 1.5s ease-in-out infinite;
    }

    .avatar + .avatar {
      margin-left: -10px;
    }

    .avatar:nth-child(1) { animation-delay: 0s; z-index: 4; }
    .avatar:nth-child(2) { animation-delay: 0.15s; z-index: 3; }
    .avatar:nth-child(3) { animation-delay: 0.3s; z-index: 2; }
    .avatar:nth-child(4) { animation-delay: 0.45s; z-index: 1; }

    @keyframes pulse {
      0%, 100% { background: #1a1a1a; }
      50% { background: #222; }
    }
  </style>
</head>
<body>
  <div class="avatar-group">
    <div class="avatar"></div>
    <div class="avatar"></div>
    <div class="avatar"></div>
    <div class="avatar"></div>
  </div>
</body>
</html>
