<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Progress Indeterminate</title>
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { height: 100%; }
    body { min-height: 100%; display: flex; align-items: center; justify-content: center; background: #0a0a0a; overflow: hidden; }

    .bar {
      width: 200px;
      height: 4px;
      background: #222;
      border-radius: 2px;
      overflow: hidden;
      position: relative;
    }

    .bar::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      width: 40%;
      height: 100%;
      background: #00ff88;
      border-radius: 2px;
      animation: slide 1.5s ease-in-out infinite alternate;
    }

    @keyframes slide {
      0% { transform: translateX(-10%); }
      100% { transform: translateX(175%); }
    }
  </style>
</head>
<body>
  <div class="bar"></div>
</body>
</html>
