<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Radial Pulse</title>
<style>
*, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
body { min-height: 100vh; background: #0a0a0a; overflow: hidden; }
.pulse-container {
  position: absolute;
  top: 50%; left: 50%;
  transform: translate(-50%, -50%);
}
.ring {
  position: absolute;
  top: 50%; left: 50%;
  transform: translate(-50%, -50%);
  border-radius: 50%;
  border: 1px solid rgba(0,255,136,0.1);
  box-shadow: 0 0 40px rgba(0,255,136,0.05), inset 0 0 40px rgba(0,255,136,0.03);
  animation: pulse 4s ease-out infinite;
}
.ring:nth-child(1) { animation-delay: 0s; }
.ring:nth-child(2) { animation-delay: 0.8s; }
.ring:nth-child(3) { animation-delay: 1.6s; }
.ring:nth-child(4) { animation-delay: 2.4s; }
.ring:nth-child(5) { animation-delay: 3.2s; }
@keyframes pulse {
  0% {
    width: 20px; height: 20px;
    opacity: 1;
    border-color: rgba(0,255,136,0.3);
    box-shadow: 0 0 30px rgba(0,255,136,0.15), inset 0 0 30px rgba(0,255,136,0.08);
  }
  100% {
    width: 1200px; height: 1200px;
    opacity: 0;
    border-color: rgba(0,255,136,0);
    box-shadow: 0 0 60px rgba(0,255,136,0), inset 0 0 60px rgba(0,255,136,0);
  }
}
.center-glow {
  position: absolute;
  top: 50%; left: 50%;
  transform: translate(-50%, -50%);
  width: 8px; height: 8px;
  border-radius: 50%;
  background: rgba(0,255,136,0.6);
  box-shadow: 0 0 30px rgba(0,255,136,0.3), 0 0 60px rgba(0,255,136,0.1);
  animation: glowPulse 2s ease-in-out infinite;
}
@keyframes glowPulse {
  0%, 100% { opacity: 0.6; transform: translate(-50%, -50%) scale(1); }
  50% { opacity: 1; transform: translate(-50%, -50%) scale(1.5); }
}
</style>
</head>
<body>
<div class="pulse-container">
  <div class="ring"></div>
  <div class="ring"></div>
  <div class="ring"></div>
  <div class="ring"></div>
  <div class="ring"></div>
</div>
<div class="center-glow"></div>
</body>
</html>
