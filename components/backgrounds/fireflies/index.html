<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fireflies</title>
<style>
*, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
body { min-height: 100vh; background: #0a0a0a; overflow: hidden; }
.firefly {
  position: absolute;
  width: 6px;
  height: 6px;
  border-radius: 50%;
  background: #00ff88;
  box-shadow: 0 0 10px #00ff88, 0 0 20px #00ff88, 0 0 40px rgba(0,255,136,0.3);
  pointer-events: none;
  will-change: transform, opacity;
}
</style>
</head>
<body>
<script>
const COUNT = 30;
const flies = [];

for (let i = 0; i < COUNT; i++) {
  const el = document.createElement('div');
  el.className = 'firefly';
  const size = 3 + Math.random() * 5;
  el.style.width = size + 'px';
  el.style.height = size + 'px';
  el.style.left = Math.random() * 100 + 'vw';
  el.style.top = Math.random() * 100 + 'vh';
  el.style.opacity = Math.random() * 0.6 + 0.2;
  document.body.appendChild(el);
  flies.push(el);
}

// Per-firefly state for continuous smooth movement
const state = flies.map(el => ({
  el,
  x: parseFloat(el.style.left) || Math.random() * 100,
  y: parseFloat(el.style.top) || Math.random() * 100,
  vx: (Math.random() - 0.5) * 0.3,
  vy: (Math.random() - 0.5) * 0.3,
  phase: Math.random() * Math.PI * 2
}));

let lastTime = performance.now();

function animate(now) {
  const dt = Math.min((now - lastTime) / 16, 3); // normalize to ~60fps
  lastTime = now;

  state.forEach(s => {
    // Gentle wandering with slight direction changes
    s.vx += (Math.random() - 0.5) * 0.04 * dt;
    s.vy += (Math.random() - 0.5) * 0.04 * dt;
    // Dampen velocity
    s.vx *= 0.99;
    s.vy *= 0.99;
    // Clamp speed
    const speed = Math.sqrt(s.vx * s.vx + s.vy * s.vy);
    if (speed > 0.5) { s.vx *= 0.5 / speed; s.vy *= 0.5 / speed; }

    s.x += s.vx * dt;
    s.y += s.vy * dt;

    // Wrap around edges
    if (s.x < -5) s.x = 105;
    if (s.x > 105) s.x = -5;
    if (s.y < -5) s.y = 105;
    if (s.y > 105) s.y = -5;

    s.phase += 0.02 * dt;
    const opacity = 0.2 + 0.5 * (0.5 + 0.5 * Math.sin(s.phase));

    s.el.style.transform = `translate(${s.x}vw, ${s.y}vh)`;
    s.el.style.opacity = opacity;
  });

  requestAnimationFrame(animate);
}

requestAnimationFrame(animate);
</script>
</body>
</html>
