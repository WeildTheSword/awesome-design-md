<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Liquid Gradient</title>
<style>
*, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
body { min-height: 100vh; background: #0a0a0a; overflow: hidden; }
.container {
  position: relative;
  width: 100vw;
  height: 100vh;
}
.blob {
  position: absolute;
  border-radius: 40% 60% 60% 40% / 50% 40% 60% 50%;
  filter: blur(60px);
  opacity: 0.35;
}
.blob-1 {
  width: 500px; height: 500px;
  background: linear-gradient(135deg, #00ff88, #3b82f6);
  top: -10%; left: -5%;
  animation: blob1 18s ease-in-out infinite;
}
.blob-2 {
  width: 450px; height: 450px;
  background: linear-gradient(135deg, #a855f7, #ec4899);
  top: 40%; right: -5%;
  animation: blob2 15s ease-in-out infinite;
}
.blob-3 {
  width: 550px; height: 550px;
  background: linear-gradient(135deg, #3b82f6, #06b6d4);
  bottom: -10%; left: 30%;
  animation: blob3 20s ease-in-out infinite;
}
.blob-4 {
  width: 400px; height: 400px;
  background: linear-gradient(135deg, #00ff88, #a855f7);
  top: 20%; left: 50%;
  animation: blob4 14s ease-in-out infinite;
}
@keyframes blob1 {
  0%, 100% { transform: translate(0, 0) scale(1); border-radius: 40% 60% 60% 40% / 50% 40% 60% 50%; }
  33% { transform: translate(150px, 100px) scale(1.2); border-radius: 60% 40% 50% 50% / 40% 60% 40% 60%; }
  66% { transform: translate(50px, 200px) scale(0.9); border-radius: 50% 50% 40% 60% / 60% 40% 50% 50%; }
}
@keyframes blob2 {
  0%, 100% { transform: translate(0, 0) scale(1); border-radius: 50% 50% 40% 60% / 40% 60% 50% 50%; }
  33% { transform: translate(-120px, -80px) scale(1.1); border-radius: 40% 60% 60% 40% / 50% 40% 60% 50%; }
  66% { transform: translate(-60px, 60px) scale(0.95); border-radius: 60% 40% 50% 50% / 60% 40% 40% 60%; }
}
@keyframes blob3 {
  0%, 100% { transform: translate(0, 0) scale(1); border-radius: 60% 40% 50% 50% / 50% 50% 40% 60%; }
  33% { transform: translate(-100px, -120px) scale(1.15); border-radius: 50% 50% 60% 40% / 40% 60% 50% 50%; }
  66% { transform: translate(100px, -60px) scale(0.85); border-radius: 40% 60% 40% 60% / 60% 40% 60% 40%; }
}
@keyframes blob4 {
  0%, 100% { transform: translate(0, 0) scale(1); }
  33% { transform: translate(-80px, 120px) scale(1.3); }
  66% { transform: translate(80px, -80px) scale(0.8); }
}
</style>
</head>
<body>
<div class="container">
  <div class="blob blob-1"></div>
  <div class="blob blob-2"></div>
  <div class="blob blob-3"></div>
  <div class="blob blob-4"></div>
</div>
</body>
</html>
