<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bubble Rise</title>
<style>
*, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
body { min-height: 100vh; background: #0a0a0a; overflow: hidden; }
.bubble {
  position: absolute;
  bottom: -50px;
  border-radius: 50%;
  border: 1px solid rgba(255,255,255,0.15);
  background: rgba(255,255,255,0.03);
  animation: rise linear infinite;
}
.bubble:nth-child(1) { width: 20px; height: 20px; left: 5%; animation-duration: 8s; animation-delay: 0s; }
.bubble:nth-child(2) { width: 35px; height: 35px; left: 12%; animation-duration: 10s; animation-delay: 1s; }
.bubble:nth-child(3) { width: 15px; height: 15px; left: 20%; animation-duration: 7s; animation-delay: 2.5s; }
.bubble:nth-child(4) { width: 40px; height: 40px; left: 28%; animation-duration: 12s; animation-delay: 0.5s; }
.bubble:nth-child(5) { width: 25px; height: 25px; left: 35%; animation-duration: 9s; animation-delay: 3s; }
.bubble:nth-child(6) { width: 12px; height: 12px; left: 42%; animation-duration: 6s; animation-delay: 1.5s; }
.bubble:nth-child(7) { width: 30px; height: 30px; left: 50%; animation-duration: 11s; animation-delay: 4s; }
.bubble:nth-child(8) { width: 18px; height: 18px; left: 57%; animation-duration: 8.5s; animation-delay: 0.8s; }
.bubble:nth-child(9) { width: 38px; height: 38px; left: 63%; animation-duration: 13s; animation-delay: 2s; }
.bubble:nth-child(10) { width: 22px; height: 22px; left: 70%; animation-duration: 7.5s; animation-delay: 3.5s; }
.bubble:nth-child(11) { width: 14px; height: 14px; left: 76%; animation-duration: 9.5s; animation-delay: 1.2s; }
.bubble:nth-child(12) { width: 32px; height: 32px; left: 82%; animation-duration: 10.5s; animation-delay: 2.8s; }
.bubble:nth-child(13) { width: 10px; height: 10px; left: 88%; animation-duration: 6.5s; animation-delay: 0.3s; }
.bubble:nth-child(14) { width: 28px; height: 28px; left: 93%; animation-duration: 11.5s; animation-delay: 4.5s; }
.bubble:nth-child(15) { width: 16px; height: 16px; left: 3%; animation-duration: 8.2s; animation-delay: 5s; }
.bubble:nth-child(16) { width: 36px; height: 36px; left: 47%; animation-duration: 14s; animation-delay: 1.8s; }
.bubble:nth-child(17) { width: 11px; height: 11px; left: 55%; animation-duration: 7.8s; animation-delay: 3.2s; }
.bubble:nth-child(18) { width: 24px; height: 24px; left: 15%; animation-duration: 9.2s; animation-delay: 0.6s; }
@keyframes rise {
  0% { transform: translateY(0) translateX(0); opacity: 0; }
  10% { opacity: 1; }
  90% { opacity: 1; }
  100% { transform: translateY(-110vh) translateX(40px); opacity: 0; }
}
</style>
</head>
<body>
<div class="bubble"></div><div class="bubble"></div><div class="bubble"></div>
<div class="bubble"></div><div class="bubble"></div><div class="bubble"></div>
<div class="bubble"></div><div class="bubble"></div><div class="bubble"></div>
<div class="bubble"></div><div class="bubble"></div><div class="bubble"></div>
<div class="bubble"></div><div class="bubble"></div><div class="bubble"></div>
<div class="bubble"></div><div class="bubble"></div><div class="bubble"></div>
</body>
</html>
