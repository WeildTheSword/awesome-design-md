<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gradient Orbs</title>
<style>
*, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
body { min-height: 100vh; background: #0a0a0a; overflow: hidden; }
.orb {
  position: absolute;
  border-radius: 50%;
  filter: blur(60px);
  opacity: 0.45;
}
.orb-1 {
  width: 250px; height: 250px;
  background: radial-gradient(circle, #00ff88, transparent 70%);
  top: -30%; left: 5%;
  animation: drift1 14s ease-in-out infinite alternate;
}
.orb-2 {
  width: 220px; height: 220px;
  background: radial-gradient(circle, #3b82f6, transparent 70%);
  top: -20%; right: 10%;
  animation: drift2 12s ease-in-out infinite alternate;
}
.orb-3 {
  width: 280px; height: 280px;
  background: radial-gradient(circle, #a855f7, transparent 70%);
  top: -40%; left: 40%;
  animation: drift3 16s ease-in-out infinite alternate;
}
.orb-4 {
  width: 200px; height: 200px;
  background: radial-gradient(circle, #00ff88, transparent 70%);
  top: -25%; right: 30%;
  animation: drift4 10s ease-in-out infinite alternate;
}
@keyframes drift1 {
  0% { transform: translate(0, 0); }
  33% { transform: translate(80px, 30px); }
  66% { transform: translate(40px, 60px); }
  100% { transform: translate(120px, 50px); }
}
@keyframes drift2 {
  0% { transform: translate(0, 0); }
  33% { transform: translate(-50px, -40px); }
  66% { transform: translate(-80px, -20px); }
  100% { transform: translate(-60px, -60px); }
}
@keyframes drift3 {
  0% { transform: translate(0, 0); }
  33% { transform: translate(-30px, -20px); }
  66% { transform: translate(-60px, 10px); }
  100% { transform: translate(-50px, -30px); }
}
@keyframes drift4 {
  0% { transform: translate(0, 0); }
  33% { transform: translate(30px, 40px); }
  66% { transform: translate(10px, 70px); }
  100% { transform: translate(40px, 50px); }
}
</style>
</head>
<body>
<div class="orb orb-1"></div>
<div class="orb orb-2"></div>
<div class="orb orb-3"></div>
<div class="orb orb-4"></div>
</body>
</html>
