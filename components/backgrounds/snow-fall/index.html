<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Snow Fall</title>
<style>
*, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
body { min-height: 100vh; background: #0a0a0a; overflow: hidden; }
.flake {
  position: absolute;
  border-radius: 50%;
  background: white;
  opacity: 0.7;
  pointer-events: none;
}
</style>
</head>
<body>
<script>
const COUNT = 50;
const flakes = [];

for (let i = 0; i < COUNT; i++) {
  const el = document.createElement('div');
  el.className = 'flake';
  const size = 3 + Math.random() * 5;
  el.style.width = size + 'px';
  el.style.height = size + 'px';
  el.style.opacity = 0.3 + Math.random() * 0.5;
  document.body.appendChild(el);
  flakes.push({
    el,
    x: Math.random() * window.innerWidth,
    y: Math.random() * window.innerHeight,
    speed: 0.5 + Math.random() * 1.5,
    drift: (Math.random() - 0.5) * 0.5,
    wobble: Math.random() * Math.PI * 2
  });
}

function update() {
  flakes.forEach(f => {
    f.y += f.speed;
    f.wobble += 0.02;
    f.x += f.drift + Math.sin(f.wobble) * 0.3;
    if (f.y > window.innerHeight + 10) {
      f.y = -10;
      f.x = Math.random() * window.innerWidth;
    }
    if (f.x > window.innerWidth) f.x = 0;
    if (f.x < 0) f.x = window.innerWidth;
    f.el.style.transform = `translate(${f.x}px, ${f.y}px)`;
  });
  requestAnimationFrame(update);
}
update();
</script>
</body>
</html>
