<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Scanlines</title>
<style>
*, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
body { min-height: 100vh; background: #0a0a0a; overflow: hidden; }
.scanlines {
  position: fixed;
  top: 0; left: 0;
  width: 100vw;
  height: 100vh;
  background: repeating-linear-gradient(
    to bottom,
    transparent 0px,
    transparent 1px,
    rgba(0,0,0,0.15) 1px,
    rgba(0,0,0,0.15) 2px
  );
  animation: flicker 0.15s infinite;
  pointer-events: none;
}
@keyframes flicker {
  0% { opacity: 0.9; }
  50% { opacity: 1; }
  100% { opacity: 0.95; }
}
.glow {
  position: fixed;
  top: 0; left: 0;
  width: 100vw;
  height: 100vh;
  background: radial-gradient(ellipse at center, rgba(20,20,30,0.3) 0%, transparent 70%);
  pointer-events: none;
}
</style>
</head>
<body>
<div class="glow"></div>
<div class="scanlines"></div>
</body>
</html>
