<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Rubber Band</title>
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      min-height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #0a0a0a;
      overflow: hidden;
    }
    .text {
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      font-size: clamp(1.5rem, 4vw, 2.5rem);
      font-weight: 800;
      letter-spacing: -0.02em;
      text-align: center;
      color: #e2e8f0;
      animation: rubberBand 3s ease-out infinite;
    }
    @keyframes rubberBand {
      0% { transform: scaleX(1) scaleY(1); }
      10% { transform: scaleX(1.25) scaleY(0.75); }
      20% { transform: scaleX(0.75) scaleY(1.25); }
      30% { transform: scaleX(1.15) scaleY(0.85); }
      40% { transform: scaleX(0.95) scaleY(1.05); }
      50% { transform: scaleX(1.05) scaleY(0.95); }
      60%, 100% { transform: scaleX(1) scaleY(1); }
    }
  </style>
</head>
<body>
  <div class="text">Your text here</div>
</body>
</html>
