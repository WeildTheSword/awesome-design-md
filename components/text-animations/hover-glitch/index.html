<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hover Glitch</title>
    <style>
        *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
        html, body { height: 100%; }
        body {
            min-height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #0a0a0a;
            overflow: hidden;
        }
        .text {
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            font-size: clamp(1.5rem, 4vw, 2.5rem);
            font-weight: 800;
            letter-spacing: -0.02em;
            text-align: center;
            color: #e2e8f0;
            position: relative;
        }
        .text::before,
        .text::after {
            content: 'Your text here';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            opacity: 0;
            animation: glitchToggle 3s ease infinite;
        }
        .text::before {
            color: #ff0040;
            animation-name: glitchBefore;
        }
        .text::after {
            color: #00ffff;
            animation-name: glitchAfter;
        }
        .text:hover::before {
            animation: glitchHoverBefore 0.5s steps(2) infinite;
            opacity: 0.8;
        }
        .text:hover::after {
            animation: glitchHoverAfter 0.5s steps(2) infinite;
            opacity: 0.8;
        }
        @keyframes glitchBefore {
            0%, 80% { opacity: 0; clip-path: inset(0 0 100% 0); }
            83% { opacity: 0.8; clip-path: inset(20% 0 60% 0); transform: translateX(-3px); }
            86% { opacity: 0.8; clip-path: inset(60% 0 10% 0); transform: translateX(3px); }
            89% { opacity: 0.8; clip-path: inset(40% 0 30% 0); transform: translateX(-2px); }
            92% { opacity: 0.8; clip-path: inset(10% 0 70% 0); transform: translateX(2px); }
            95% { opacity: 0.8; clip-path: inset(50% 0 20% 0); transform: translateX(-3px); }
            97%, 100% { opacity: 0; clip-path: inset(0 0 100% 0); transform: translateX(0); }
        }
        @keyframes glitchAfter {
            0%, 80% { opacity: 0; clip-path: inset(0 0 100% 0); }
            83% { opacity: 0.8; clip-path: inset(50% 0 20% 0); transform: translateX(3px); }
            86% { opacity: 0.8; clip-path: inset(10% 0 70% 0); transform: translateX(-3px); }
            89% { opacity: 0.8; clip-path: inset(30% 0 40% 0); transform: translateX(2px); }
            92% { opacity: 0.8; clip-path: inset(70% 0 10% 0); transform: translateX(-2px); }
            95% { opacity: 0.8; clip-path: inset(20% 0 50% 0); transform: translateX(3px); }
            97%, 100% { opacity: 0; clip-path: inset(0 0 100% 0); transform: translateX(0); }
        }
        @keyframes glitchHoverBefore {
            0% { clip-path: inset(20% 0 60% 0); transform: translateX(-3px); }
            50% { clip-path: inset(60% 0 10% 0); transform: translateX(3px); }
            100% { clip-path: inset(40% 0 30% 0); transform: translateX(-2px); }
        }
        @keyframes glitchHoverAfter {
            0% { clip-path: inset(50% 0 20% 0); transform: translateX(3px); }
            50% { clip-path: inset(10% 0 70% 0); transform: translateX(-3px); }
            100% { clip-path: inset(30% 0 40% 0); transform: translateX(2px); }
        }
    </style>
</head>
<body>
    <div class="text">Your text here</div>
</body>
</html>
