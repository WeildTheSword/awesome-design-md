<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hover Underline Slide</title>
    <style>
        *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
        html, body { height: 100%; }
        body {
            min-height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #0a0a0a;
            overflow: hidden;
        }
        .text {
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            font-size: clamp(1.5rem, 4vw, 2.5rem);
            font-weight: 800;
            letter-spacing: -0.02em;
            text-align: center;
            color: #e2e8f0;
            position: relative;
            display: inline-block;
        }
        .text::after {
            content: '';
            position: absolute;
            bottom: -4px;
            left: 0;
            width: 100%;
            height: 2px;
            background: #00ff88;
            transform-origin: left;
            transform: scaleX(0);
            animation: underlineLoop 3s ease-in-out infinite;
            transition: transform 0.4s ease;
        }
        .text:hover::after {
            transform: scaleX(1);
            animation: none;
        }
        @keyframes underlineLoop {
            0%, 10% { transform: scaleX(0); }
            30%, 70% { transform: scaleX(1); }
            90%, 100% { transform: scaleX(0); }
        }
    </style>
</head>
<body>
    <div class="text">Your text here</div>
</body>
</html>
