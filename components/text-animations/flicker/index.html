<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flicker</title>
    <style>
        *, *::before, *::after {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        html, body {
            height: 100%;
        }
        body {
            min-height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #0a0a0a;
            overflow: hidden;
        }
        .text {
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            font-size: clamp(1.5rem, 4vw, 2.5rem);
            font-weight: 800;
            letter-spacing: -0.02em;
            text-align: center;
            color: #e2e8f0;
            text-shadow: 0 0 8px rgba(226, 232, 240, 0.6), 0 0 20px rgba(226, 232, 240, 0.3);
            animation: flicker 0.5s infinite;
        }
        @keyframes flicker {
            0% { opacity: 1; }
            15% { opacity: 0.2; }
            30% { opacity: 0.9; }
            45% { opacity: 0.1; }
            60% { opacity: 0.7; }
            80% { opacity: 0.3; }
            100% { opacity: 1; }
        }
    </style>
</head>
<body>
    <div class="text">Your text here</div>
</body>
</html>
