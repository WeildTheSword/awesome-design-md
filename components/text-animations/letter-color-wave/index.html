<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Letter Color Wave</title>
    <style>
        *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
        html, body { height: 100%; }
        body {
            min-height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #0a0a0a;
            overflow: hidden;
        }
        .text {
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            font-size: clamp(1.5rem, 4vw, 2.5rem);
            font-weight: 800;
            letter-spacing: -0.02em;
            text-align: center;
            color: #e2e8f0;
        }
        .text span {
            display: inline-block;
            color: #e2e8f0;
            transition: color 0.3s ease;
        }
        .text span.highlight {
            color: #00ff88;
        }
    </style>
</head>
<body>
    <div class="text">Your text here</div>
    <script>
    (function() {
        var el = document.querySelector('.text');
        var text = el.textContent;
        el.innerHTML = '';
        for (var i = 0; i < text.length; i++) {
            var span = document.createElement('span');
            span.textContent = text[i] === ' ' ? '\u00a0' : text[i];
            el.appendChild(span);
        }
        var spans = el.querySelectorAll('span');
        var current = 0;
        var highlightDuration = 150;

        function wave() {
            if (current > 0) {
                spans[current - 1].classList.remove('highlight');
            }
            if (current < spans.length) {
                spans[current].classList.add('highlight');
                current++;
                setTimeout(wave, highlightDuration);
            } else {
                spans[spans.length - 1].classList.remove('highlight');
                current = 0;
                setTimeout(wave, 600);
            }
        }

        wave();
    })();
    </script>
</body>
</html>
