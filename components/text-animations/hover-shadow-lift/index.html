<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hover Shadow Lift</title>
    <style>
        *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
        html, body { height: 100%; }
        body {
            min-height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #0a0a0a;
            overflow: hidden;
        }
        .text {
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            font-size: clamp(1.5rem, 4vw, 2.5rem);
            font-weight: 800;
            letter-spacing: -0.02em;
            text-align: center;
            color: #e2e8f0;
            transform: translateY(0);
            text-shadow: 0 0 0 rgba(0, 255, 136, 0);
            animation: liftLoop 3s ease-in-out infinite;
            transition: transform 0.4s ease, text-shadow 0.4s ease;
        }
        .text:hover {
            transform: translateY(-5px);
            text-shadow: 0 8px 15px rgba(0, 255, 136, 0.3);
            animation: none;
        }
        @keyframes liftLoop {
            0%, 10% {
                transform: translateY(0);
                text-shadow: 0 0 0 rgba(0, 255, 136, 0);
            }
            30%, 70% {
                transform: translateY(-5px);
                text-shadow: 0 8px 15px rgba(0, 255, 136, 0.3);
            }
            90%, 100% {
                transform: translateY(0);
                text-shadow: 0 0 0 rgba(0, 255, 136, 0);
            }
        }
    </style>
</head>
<body>
    <div class="text">Your text here</div>
</body>
</html>
