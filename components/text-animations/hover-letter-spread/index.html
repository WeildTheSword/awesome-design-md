<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hover Letter Spread</title>
    <style>
        *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
        html, body { height: 100%; }
        body {
            min-height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #0a0a0a;
            overflow: hidden;
        }
        .text {
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            font-size: clamp(1.5rem, 4vw, 2.5rem);
            font-weight: 800;
            letter-spacing: -0.02em;
            text-align: center;
            color: #e2e8f0;
            animation: spreadLoop 3s ease-in-out infinite;
            transition: letter-spacing 0.4s ease;
        }
        .text:hover {
            letter-spacing: 0.15em;
            animation: none;
        }
        @keyframes spreadLoop {
            0%, 10% { letter-spacing: -0.02em; }
            30%, 70% { letter-spacing: 0.15em; }
            90%, 100% { letter-spacing: -0.02em; }
        }
    </style>
</head>
<body>
    <div class="text">Your text here</div>
</body>
</html>
