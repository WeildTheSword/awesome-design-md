<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Typewriter Reverse</title>
    <style>
        *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
        html, body { height: 100%; }
        body {
            min-height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #0a0a0a;
            overflow: hidden;
        }
        .text {
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            font-size: clamp(1.5rem, 4vw, 2.5rem);
            font-weight: 800;
            letter-spacing: -0.02em;
            text-align: center;
            color: #e2e8f0;
            border-right: 2px solid #e2e8f0;
        }
    </style>
</head>
<body>
    <div class="text">Your text here</div>
    <script>
    (function() {
        var el = document.querySelector('.text');
        var fullText = 'Your text here';
        var index = fullText.length;
        var deleting = true;
        var speed = 100;

        function tick() {
            if (deleting) {
                if (index > 0) {
                    index--;
                    el.textContent = fullText.substring(0, index);
                    setTimeout(tick, speed);
                } else {
                    deleting = false;
                    setTimeout(tick, 400);
                }
            } else {
                if (index < fullText.length) {
                    index++;
                    el.textContent = fullText.substring(0, index);
                    setTimeout(tick, speed);
                } else {
                    deleting = true;
                    setTimeout(tick, 1500);
                }
            }
        }

        setTimeout(function() {
            tick();
        }, 1500);
    })();
    </script>
</body>
</html>
