<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Text Decode</title>
    <style>
        *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
        html, body { height: 100%; }
        body {
            min-height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #0a0a0a;
            overflow: hidden;
        }
        .text {
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            font-size: clamp(1.5rem, 4vw, 2.5rem);
            font-weight: 800;
            letter-spacing: -0.02em;
            text-align: center;
            color: #e2e8f0;
        }
    </style>
</head>
<body>
    <div class="text">Your text here</div>
    <script>
    (function() {
        var el = document.querySelector('.text');
        var original = 'Your text here';
        var len = original.length;

        function scramble() {
            var result = '';
            for (var i = 0; i < len; i++) {
                if (original[i] === ' ') {
                    result += ' ';
                } else {
                    result += Math.random() > 0.5 ? '1' : '0';
                }
            }
            return result;
        }

        function run() {
            var resolved = 0;
            var scrambleInterval = setInterval(function() {
                var display = '';
                for (var i = 0; i < len; i++) {
                    if (i < resolved) {
                        display += original[i];
                    } else if (original[i] === ' ') {
                        display += ' ';
                    } else {
                        display += Math.random() > 0.5 ? '1' : '0';
                    }
                }
                el.textContent = display;
            }, 50);

            var resolveInterval = setInterval(function() {
                resolved++;
                if (resolved > len) {
                    clearInterval(scrambleInterval);
                    clearInterval(resolveInterval);
                    el.textContent = original;
                }
            }, 120);
        }

        run();
        setInterval(run, 4000);
    })();
    </script>
</body>
</html>
