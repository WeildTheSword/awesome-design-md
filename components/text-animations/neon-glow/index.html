<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Neon Glow</title>
    <style>
        *, *::before, *::after {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            height: 100%;
        }

        body {
            min-height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #0a0a0a;
            overflow: hidden;
        }

        .text {
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            font-size: clamp(1.5rem, 4vw, 2.5rem);
            font-weight: 800;
            letter-spacing: -0.02em;
            text-align: center;
            color: #00ff88;
            animation: neon-glow 2s ease-in-out infinite;
        }

        @keyframes neon-glow {
            0%, 100% {
                text-shadow:
                    0 0 4px #00ff88,
                    0 0 8px #00ff88,
                    0 0 16px rgba(0, 255, 136, 0.4);
            }
            50% {
                text-shadow:
                    0 0 8px #00ff88,
                    0 0 20px #00ff88,
                    0 0 40px rgba(0, 255, 136, 0.6),
                    0 0 80px rgba(0, 255, 136, 0.3);
            }
        }
    </style>
</head>
<body>
    <div class="text">Your text here</div>
</body>
</html>
