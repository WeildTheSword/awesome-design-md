<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hover Fill</title>
    <style>
        *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
        html, body { height: 100%; }
        body {
            min-height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #0a0a0a;
            overflow: hidden;
        }
        .text {
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            font-size: clamp(1.5rem, 4vw, 2.5rem);
            font-weight: 800;
            letter-spacing: -0.02em;
            text-align: center;
            color: transparent;
            background: linear-gradient(to top, #00ff88 50%, #e2e8f0 50%);
            background-size: 100% 200%;
            background-position: top;
            -webkit-background-clip: text;
            background-clip: text;
            animation: fillLoop 3s ease-in-out infinite;
            transition: background-position 0.5s ease;
        }
        .text:hover {
            background-position: bottom;
            animation: none;
        }
        @keyframes fillLoop {
            0%, 10% { background-position: top; }
            30%, 70% { background-position: bottom; }
            90%, 100% { background-position: top; }
        }
    </style>
</head>
<body>
    <div class="text">Your text here</div>
</body>
</html>
