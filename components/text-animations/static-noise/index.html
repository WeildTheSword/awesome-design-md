<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Static Noise</title>
    <style>
        *, *::before, *::after {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        html, body {
            height: 100%;
        }
        body {
            min-height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #0a0a0a;
            overflow: hidden;
        }
        .text {
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            font-size: clamp(1.5rem, 4vw, 2.5rem);
            font-weight: 800;
            letter-spacing: -0.02em;
            text-align: center;
            color: #e2e8f0;
            position: relative;
            display: inline-block;
        }
        .text::after {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: repeating-linear-gradient(
                0deg,
                rgba(255, 255, 255, 0.08) 0px,
                rgba(0, 0, 0, 0.08) 1px,
                transparent 2px,
                transparent 3px
            ),
            repeating-linear-gradient(
                90deg,
                rgba(255, 255, 255, 0.06) 0px,
                rgba(0, 0, 0, 0.06) 1px,
                transparent 2px,
                transparent 3px
            );
            background-size: 4px 4px, 3px 3px;
            opacity: 0.5;
            pointer-events: none;
            animation: static-noise 0.15s steps(5) infinite;
        }
        @keyframes static-noise {
            0% { background-position: 0px 0px, 0px 0px; }
            20% { background-position: -3px 2px, 4px -1px; }
            40% { background-position: 2px -4px, -2px 3px; }
            60% { background-position: -1px 3px, 1px -4px; }
            80% { background-position: 4px -1px, -3px 2px; }
            100% { background-position: 0px 0px, 0px 0px; }
        }
    </style>
</head>
<body>
    <div class="text">Your text here</div>
</body>
</html>
