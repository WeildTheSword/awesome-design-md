<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Color Cycle</title>
    <style>
        *, *::before, *::after {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            height: 100%;
        }

        body {
            min-height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #0a0a0a;
            overflow: hidden;
        }

        .text {
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            font-size: clamp(1.5rem, 4vw, 2.5rem);
            font-weight: 800;
            letter-spacing: -0.02em;
            text-align: center;
            color: #e2e8f0;
            animation: color-cycle 6s infinite;
        }

        @keyframes color-cycle {
            0%, 100% { color: #e2e8f0; }
            20% { color: #00ff88; }
            40% { color: #3b82f6; }
            60% { color: #a855f7; }
            80% { color: #ec4899; }
        }
    </style>
</head>
<body>
    <div class="text">Your text here</div>
</body>
</html>
