<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Text Rotate</title>
  <style>
    *, *::before, *::after {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      height: 100%;
    }

    body {
      min-height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #0a0a0a;
      overflow: hidden;
    }

    .rotate-container {
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      font-size: clamp(1.5rem, 4vw, 2.5rem);
      font-weight: 800;
      letter-spacing: -0.02em;
      text-align: center;
      color: #e2e8f0;
      height: 1.2em;
      line-height: 1.2em;
      overflow: hidden;
      position: relative;
    }

    .rotate-inner {
      transition: transform 0.5s ease;
    }

    .rotate-inner .word {
      display: block;
      height: 1.2em;
      line-height: 1.2em;
    }
  </style>
</head>
<body>
  <div class="rotate-container">
    <div class="rotate-inner">
      <span class="word">Your text here</span>
      <span class="word">Make it shine</span>
      <span class="word">Build with ease</span>
    </div>
  </div>
  <script>
    (function () {
      var inner = document.querySelector('.rotate-inner');
      var words = document.querySelectorAll('.word');
      var total = words.length;
      var current = 0;

      setInterval(function () {
        current = (current + 1) % total;
        inner.style.transform = 'translateY(-' + (current * 1.2) + 'em)';
      }, 2000);
    })();
  </script>
</body>
</html>
