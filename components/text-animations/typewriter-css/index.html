<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Typewriter CSS</title>
  <style>
    *, *::before, *::after {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      height: 100%;
    }

    body {
      min-height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #0a0a0a;
      overflow: hidden;
    }

    .text {
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      font-size: clamp(1.5rem, 4vw, 2.5rem);
      font-weight: 800;
      letter-spacing: -0.02em;
      text-align: center;
      color: #e2e8f0;
      width: 0;
      overflow: hidden;
      white-space: nowrap;
      border-right: 3px solid #e2e8f0;
      animation: typewriter 4s steps(14) infinite, blink 0.7s step-end infinite;
    }

    @keyframes typewriter {
      0%   { width: 0; }
      35%  { width: 14ch; }
      65%  { width: 14ch; }
      100% { width: 0; }
    }

    @keyframes blink {
      50% { border-color: transparent; }
    }
  </style>
</head>
<body>
  <div class="text">Your text here</div>
</body>
</html>
