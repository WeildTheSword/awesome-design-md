<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mask Slide</title>
  <style>
    *, *::before, *::after {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      height: 100%;
    }

    body {
      min-height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #0a0a0a;
      overflow: hidden;
    }

    .text {
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      font-size: clamp(1.5rem, 4vw, 2.5rem);
      font-weight: 800;
      letter-spacing: -0.02em;
      text-align: center;
      color: #e2e8f0;
      position: relative;
      display: inline-block;
      clip-path: inset(0 100% 0 0);
      animation: revealBehind 3s ease infinite;
    }

    .text::after {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: #00ff88;
      transform: translateX(-100%);
      animation: maskSlide 3s ease infinite;
    }

    @keyframes revealBehind {
      0% {
        clip-path: inset(0 100% 0 0);
      }
      15% {
        clip-path: inset(0 100% 0 0);
      }
      30% {
        clip-path: inset(0 0 0 0);
      }
      66.66% {
        clip-path: inset(0 0 0 0);
      }
      100% {
        clip-path: inset(0 100% 0 0);
      }
    }

    @keyframes maskSlide {
      0% {
        transform: translateX(-100%);
      }
      15% {
        transform: translateX(0);
      }
      30% {
        transform: translateX(100%);
      }
      100% {
        transform: translateX(100%);
      }
    }
  </style>
</head>
<body>
  <div class="text">Your text here</div>
</body>
</html>
