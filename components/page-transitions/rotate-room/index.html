<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Rotate Room</title>
<style>
*, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
html, body { height: 100%; }
body { min-height: 100%; background: #0a0a0a; overflow: hidden; }

.scene {
  width: 100%; height: 100%;
  perspective: 800px;
}

.cube {
  width: 100%; height: 100%;
  position: relative;
  transform-style: preserve-3d;
  animation: rotateCube 4s ease-in-out infinite;
}

.face {
  position: absolute;
  top: 0; left: 0;
  width: 100%; height: 100%;
  display: flex;
  align-items: center;
  justify-content: center;
  backface-visibility: hidden;
}

.face h1 {
  color: #e2e8f0;
  font-family: 'Segoe UI', system-ui, sans-serif;
  font-size: 1.5rem;
  font-weight: 700;
}

.face-front {
  background: #0a0a0a;
}

.face-right {
  background: #111;
  transform: rotateY(90deg) translateZ(50vw);
  transform-origin: center center;
}

.face-front {
  transform: translateZ(50vw);
}

@keyframes rotateCube {
  0%, 20% { transform: translateZ(-50vw) rotateY(0deg); }
  45%, 55% { transform: translateZ(-50vw) rotateY(-90deg); }
  80%, 100% { transform: translateZ(-50vw) rotateY(0deg); }
}
</style>
</head>
<body>
<div class="scene">
  <div class="cube">
    <div class="face face-front"><h1>Page One</h1></div>
    <div class="face face-right"><h1>Page Two</h1></div>
  </div>
</div>
</body>
</html>
