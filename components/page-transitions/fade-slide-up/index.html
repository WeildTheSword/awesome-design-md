<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fade Slide Up</title>
<style>
  *, *::before, *::after {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }

  body {
    background: #0a0a0a;
    color: #e0e0e0;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 10px 16px;
  }

  @keyframes fadeSlideUp {
    from {
      opacity: 0;
      transform: translateY(20px);
    }
    to {
      opacity: 1;
      transform: translateY(0);
    }
  }

  .container {
    display: flex;
    gap: 12px;
    align-items: center;
    justify-content: center;
  }

  .animate-in {
    opacity: 0;
    animation: fadeSlideUp 0.7s cubic-bezier(0.16, 1, 0.3, 1) forwards;
  }

  .item {
    width: 60px;
    height: 50px;
    background: #111;
    border: 1px solid #222;
    border-radius: 8px;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .item:nth-child(1) { animation-delay: 0.1s; }
  .item:nth-child(2) { animation-delay: 0.25s; }
  .item:nth-child(3) { animation-delay: 0.4s; }

  .item-icon {
    width: 20px;
    height: 20px;
    border-radius: 5px;
  }

  .item:nth-child(1) .item-icon { background: linear-gradient(135deg, #00ff88, #00cc6a); }
  .item:nth-child(2) .item-icon { background: linear-gradient(135deg, #3b82f6, #2563eb); }
  .item:nth-child(3) .item-icon { background: linear-gradient(135deg, #a855f7, #7c3aed); }
</style>
</head>
<body>
  <div class="container">
    <div class="item animate-in">
      <div class="item-icon"></div>
    </div>
    <div class="item animate-in">
      <div class="item-icon"></div>
    </div>
    <div class="item animate-in">
      <div class="item-icon"></div>
    </div>
  </div>
</body>
</html>
