<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Content Blocks</title>
<style>
*, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
html, body { height: 100%; }
body { min-height: 100%; background: #0a0a0a; overflow: hidden; }

.container {
  width: 100%; height: 100%;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 6px;
  padding: 10px 20px;
}

.block {
  width: 70%;
  height: 18px;
  background: #e2e8f0;
  border-radius: 4px;
  opacity: 0;
  transform: translateY(20px);
  animation: slideUpFade 3.5s ease-out infinite;
}

.block:nth-child(1) {
  animation-delay: 0s;
}

.block:nth-child(2) {
  animation-delay: 0.2s;
}

.block:nth-child(3) {
  animation-delay: 0.4s;
}

@keyframes slideUpFade {
  0% { opacity: 0; transform: translateY(20px); }
  15%, 65% { opacity: 1; transform: translateY(0); }
  85%, 100% { opacity: 0; transform: translateY(20px); }
}
</style>
</head>
<body>
<div class="container">
  <div class="block"></div>
  <div class="block"></div>
  <div class="block"></div>
</div>
</body>
</html>
