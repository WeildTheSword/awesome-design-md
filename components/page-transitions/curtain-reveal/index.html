<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Curtain Reveal</title>
<style>
  *, *::before, *::after {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }

  body {
    background: #0a0a0a;
    color: #e0e0e0;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    height: 100vh;
    overflow: hidden;
  }

  .curtain-wrapper {
    position: fixed;
    inset: 0;
    z-index: 1000;
    pointer-events: none;
  }

  .curtain-wrapper::before,
  .curtain-wrapper::after {
    content: '';
    position: absolute;
    top: 0;
    width: 50%;
    height: 100%;
    background: linear-gradient(135deg, #00ff88, #3b82f6);
    z-index: 1000;
  }

  .curtain-wrapper::before {
    left: 0;
    animation: curtainLeft 1s cubic-bezier(0.77, 0, 0.175, 1) infinite;
  }

  .curtain-wrapper::after {
    right: 0;
    animation: curtainRight 1s cubic-bezier(0.77, 0, 0.175, 1) infinite;
  }

  @keyframes curtainLeft {
    0%, 100% { transform: translateX(0); }
    40%, 60% { transform: translateX(-100%); }
  }

  @keyframes curtainRight {
    0%, 100% { transform: translateX(0); }
    40%, 60% { transform: translateX(100%); }
  }

  .content {
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    height: 100vh;
    opacity: 1;
  }

  .content h1 {
    font-size: 1.6rem;
    font-weight: 700;
    color: #ffffff;
    letter-spacing: -0.02em;
  }

  .content p {
    margin-top: 8px;
    font-size: 0.85rem;
    color: #666;
  }

  .accent-line {
    width: 40px;
    height: 2px;
    background: linear-gradient(90deg, #00ff88, #3b82f6);
    border-radius: 2px;
    margin-top: 12px;
  }
</style>
</head>
<body>
  <div class="curtain-wrapper"></div>
  <div class="content">
    <h1>Welcome</h1>
    <p>The stage is yours</p>
    <div class="accent-line"></div>
  </div>
</body>
</html>
