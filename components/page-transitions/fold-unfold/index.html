<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fold Unfold</title>
<style>
*, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
html, body { height: 100%; }
body { min-height: 100%; background: #0a0a0a; overflow: hidden; }

.container {
  width: 100%; height: 100%;
  perspective: 1000px;
  position: relative;
}

.page {
  position: absolute;
  top: 0; left: 0;
  width: 100%; height: 100%;
  display: flex;
  align-items: center;
  justify-content: center;
  backface-visibility: hidden;
}

.page h1 {
  color: #e2e8f0;
  font-family: 'Segoe UI', system-ui, sans-serif;
  font-size: 1.5rem;
  font-weight: 700;
}

.page-one {
  background: #0a0a0a;
  transform-origin: left center;
  animation: foldOut 4s ease-in-out infinite;
}

.page-two {
  background: #111;
  transform-origin: right center;
  animation: unfoldIn 4s ease-in-out infinite;
}

@keyframes foldOut {
  0%, 15% { transform: rotateY(0deg); opacity: 1; }
  40% { transform: rotateY(-90deg); opacity: 0; }
  41%, 100% { opacity: 0; transform: rotateY(-90deg); }
  95%, 100% { transform: rotateY(0deg); opacity: 1; }
}

@keyframes unfoldIn {
  0%, 40% { transform: rotateY(90deg); opacity: 0; }
  65%, 85% { transform: rotateY(0deg); opacity: 1; }
  95% { transform: rotateY(0deg); opacity: 1; }
  100% { transform: rotateY(90deg); opacity: 0; }
}
</style>
</head>
<body>
<div class="container">
  <div class="page page-two"><h1>Page Two</h1></div>
  <div class="page page-one"><h1>Page One</h1></div>
</div>
</body>
</html>
