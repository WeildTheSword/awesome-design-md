<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Flip Page</title>
<style>
*, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
html, body { height: 100%; }
body { min-height: 100%; background: #0a0a0a; overflow: hidden; }

.container {
  width: 100%; height: 100%;
  perspective: 1000px;
  position: relative;
}

.page {
  position: absolute;
  top: 0; left: 0;
  width: 100%; height: 100%;
  display: flex;
  align-items: center;
  justify-content: center;
  backface-visibility: hidden;
}

.page h1 {
  color: #e2e8f0;
  font-family: 'Segoe UI', system-ui, sans-serif;
  font-size: 1.5rem;
  font-weight: 700;
}

.page-one {
  background: #0a0a0a;
  animation: flipOut 4s ease-in-out infinite;
}

.page-two {
  background: #111;
  animation: flipIn 4s ease-in-out infinite;
}

@keyframes flipOut {
  0%, 20% { transform: rotateY(0deg); }
  45%, 55% { transform: rotateY(-90deg); }
  80%, 100% { transform: rotateY(0deg); }
}

@keyframes flipIn {
  0%, 20% { transform: rotateY(90deg); }
  45%, 55% { transform: rotateY(0deg); }
  80%, 100% { transform: rotateY(90deg); }
}
</style>
</head>
<body>
<div class="container">
  <div class="page page-two"><h1>Page Two</h1></div>
  <div class="page page-one"><h1>Page One</h1></div>
</div>
</body>
</html>
