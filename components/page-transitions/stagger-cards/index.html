<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Stagger Cards</title>
<style>
  *, *::before, *::after {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }

  body {
    background: #0a0a0a;
    color: #e0e0e0;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 10px 16px;
  }

  @keyframes staggerIn {
    from {
      opacity: 0;
      transform: translateY(30px);
    }
    to {
      opacity: 1;
      transform: translateY(0);
    }
  }

  .grid {
    display: flex;
    gap: 10px;
    justify-content: center;
  }

  .card {
    width: 40px;
    height: 40px;
    background: #111;
    border: 1px solid #222;
    border-radius: 8px;
    opacity: 0;
    animation: staggerIn 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 0.6rem;
    font-weight: 600;
    transition: border-color 0.3s ease;
  }

  .card:hover {
    border-color: #333;
  }

  .card:nth-child(1) { animation-delay: 0.0s; color: #00ff88; }
  .card:nth-child(2) { animation-delay: 0.1s; color: #3b82f6; }
  .card:nth-child(3) { animation-delay: 0.2s; color: #a855f7; }
  .card:nth-child(4) { animation-delay: 0.3s; color: #f59e0b; }
</style>
</head>
<body>
  <div class="grid">
    <div class="card">01</div>
    <div class="card">02</div>
    <div class="card">03</div>
    <div class="card">04</div>
  </div>
</body>
</html>
