<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Stagger List</title>
<style>
*, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
html, body { height: 100%; }
body { min-height: 100%; background: #0a0a0a; overflow: hidden; }

.container {
  width: 100%; height: 100%;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 6px;
  padding: 10px 20px;
}

.bar {
  width: 70%;
  height: 10px;
  border-radius: 4px;
  background: #e2e8f0;
  opacity: 0;
  animation: slideBar 3s ease-out infinite;
}

.bar:nth-child(odd) {
  animation-name: slideFromLeft;
}

.bar:nth-child(even) {
  animation-name: slideFromRight;
}

.bar:nth-child(1) { animation-delay: 0s; }
.bar:nth-child(2) { animation-delay: 0.15s; }
.bar:nth-child(3) { animation-delay: 0.3s; }
.bar:nth-child(4) { animation-delay: 0.45s; }
.bar:nth-child(5) { animation-delay: 0.6s; }

@keyframes slideFromLeft {
  0% { transform: translateX(-100%); opacity: 0; }
  20%, 70% { transform: translateX(0); opacity: 1; }
  90%, 100% { transform: translateX(-100%); opacity: 0; }
}

@keyframes slideFromRight {
  0% { transform: translateX(100%); opacity: 0; }
  20%, 70% { transform: translateX(0); opacity: 1; }
  90%, 100% { transform: translateX(100%); opacity: 0; }
}
</style>
</head>
<body>
<div class="container">
  <div class="bar"></div>
  <div class="bar"></div>
  <div class="bar"></div>
  <div class="bar"></div>
  <div class="bar"></div>
</div>
</body>
</html>
