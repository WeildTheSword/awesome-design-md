<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Stagger Grid</title>
<style>
*, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
html, body { height: 100%; }
body { min-height: 100%; background: #0a0a0a; overflow: hidden; }

.container {
  width: 100%; height: 100%;
  display: flex;
  align-items: center;
  justify-content: center;
}

.grid {
  display: grid;
  grid-template-columns: repeat(3, 24px);
  grid-template-rows: repeat(3, 24px);
  gap: 6px;
}

.cell {
  background: #e2e8f0;
  border-radius: 4px;
  opacity: 0;
  transform: scale(0);
  animation: popIn 3s ease-out infinite;
}

.cell:nth-child(1) { animation-delay: 0s; }
.cell:nth-child(2) { animation-delay: 0.1s; }
.cell:nth-child(3) { animation-delay: 0.2s; }
.cell:nth-child(4) { animation-delay: 0.1s; }
.cell:nth-child(5) { animation-delay: 0.2s; }
.cell:nth-child(6) { animation-delay: 0.3s; }
.cell:nth-child(7) { animation-delay: 0.2s; }
.cell:nth-child(8) { animation-delay: 0.3s; }
.cell:nth-child(9) { animation-delay: 0.4s; }

@keyframes popIn {
  0% { opacity: 0; transform: scale(0); }
  20%, 65% { opacity: 1; transform: scale(1); }
  85%, 100% { opacity: 0; transform: scale(0); }
}
</style>
</head>
<body>
<div class="container">
  <div class="grid">
    <div class="cell"></div>
    <div class="cell"></div>
    <div class="cell"></div>
    <div class="cell"></div>
    <div class="cell"></div>
    <div class="cell"></div>
    <div class="cell"></div>
    <div class="cell"></div>
    <div class="cell"></div>
  </div>
</div>
</body>
</html>
