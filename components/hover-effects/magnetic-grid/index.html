<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Magnetic Grid</title>
<style>
*, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
html, body { height: 100%; }
body { min-height: 100%; display: flex; align-items: center; justify-content: center; background: #0a0a0a; overflow: hidden; font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; }

.grid {
  position: relative;
  width: 280px;
  height: 180px;
}

.dot {
  position: absolute;
  width: 8px;
  height: 8px;
  border-radius: 50%;
  background: #444;
  transition: background 0.2s;
}
</style>
</head>
<body>
<div class="grid" id="grid"></div>
<script>
const grid = document.getElementById('grid');
const cols = 6, rows = 4;
const dots = [];
const spacingX = 280 / (cols - 1);
const spacingY = 180 / (rows - 1);

for (let r = 0; r < rows; r++) {
  for (let c = 0; c < cols; c++) {
    const dot = document.createElement('div');
    dot.className = 'dot';
    const ox = c * spacingX;
    const oy = r * spacingY;
    dot.style.left = ox + 'px';
    dot.style.top = oy + 'px';
    grid.appendChild(dot);
    dots.push({ el: dot, ox, oy });
  }
}

let angle = 0;
let hasMouse = false;
let mouseX = 0, mouseY = 0;

grid.addEventListener('mousemove', (e) => {
  hasMouse = true;
  const rect = grid.getBoundingClientRect();
  mouseX = e.clientX - rect.left;
  mouseY = e.clientY - rect.top;
});

grid.addEventListener('mouseleave', () => { hasMouse = false; });

function animate() {
  let cx, cy;
  if (hasMouse) {
    cx = mouseX;
    cy = mouseY;
  } else {
    angle += 0.02;
    cx = 140 + Math.cos(angle) * 100;
    cy = 90 + Math.sin(angle) * 60;
  }

  const maxDist = 120;
  const maxShift = 15;

  for (const d of dots) {
    const dx = d.ox - cx;
    const dy = d.oy - cy;
    const dist = Math.sqrt(dx * dx + dy * dy);
    let shiftX = 0, shiftY = 0;
    if (dist < maxDist && dist > 0) {
      const factor = (1 - dist / maxDist) * maxShift;
      shiftX = (dx / dist) * -factor;
      shiftY = (dy / dist) * -factor;
    }
    const brightness = dist < maxDist ? Math.round(68 + (1 - dist / maxDist) * 187) : 68;
    d.el.style.transform = `translate(${shiftX}px, ${shiftY}px)`;
    d.el.style.background = `rgb(0, ${brightness}, ${Math.round(brightness * 0.55)})`;
  }

  requestAnimationFrame(animate);
}
animate();
</script>
</body>
</html>
