<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Border Trace</title>
<style>
*, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
html, body { height: 100%; }
body { min-height: 100%; display: flex; align-items: center; justify-content: center; background: #0a0a0a; overflow: hidden; font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; }

.card {
  position: relative;
  width: 200px;
  padding: 1.5rem;
  border-radius: 12px;
  background: #111;
  color: #e2e8f0;
  overflow: hidden;
}

.card h3 { font-size: 0.95rem; margin-bottom: 0.5rem; }
.card p { font-size: 0.8rem; color: #888; }

.card::before {
  content: '';
  position: absolute;
  top: 0; left: 0;
  width: 100%;
  height: 100%;
  border-radius: 12px;
  padding: 1px;
  background: conic-gradient(from var(--angle, 0deg), #00ff88, transparent 40%, transparent 60%, #00ff88);
  -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
  mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
  -webkit-mask-composite: xor;
  mask-composite: exclude;
  animation: borderTrace 3s linear infinite;
}

@property --angle {
  syntax: '<angle>';
  inherits: false;
  initial-value: 0deg;
}

@keyframes borderTrace {
  to { --angle: 360deg; }
}
</style>
</head>
<body>
<div class="card">
  <h3>Border Trace</h3>
  <p>Tracing light effect</p>
</div>
</body>
</html>
