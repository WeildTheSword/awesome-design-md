<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cursor Follow</title>
<style>
*, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
html, body { height: 100%; }
body { min-height: 100%; display: flex; align-items: center; justify-content: center; background: #0a0a0a; overflow: hidden; font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; }

.cursor {
  width: 20px;
  height: 20px;
  border-radius: 50%;
  background: #00ff88;
  opacity: 0.5;
  position: fixed;
  pointer-events: none;
  transform: translate(-50%, -50%);
  z-index: 999;
}

.label {
  color: #555;
  font-size: 0.85rem;
}
</style>
</head>
<body>
<div class="label">Move your mouse</div>
<div class="cursor" id="cursor"></div>
<script>
const cursor = document.getElementById('cursor');
let mouseX = window.innerWidth / 2;
let mouseY = window.innerHeight / 2;
let curX = mouseX;
let curY = mouseY;
let hasMouse = false;
let angle = 0;
const cx = window.innerWidth / 2;
const cy = window.innerHeight / 2;
const radius = 60;

document.addEventListener('mousemove', (e) => {
  hasMouse = true;
  mouseX = e.clientX;
  mouseY = e.clientY;
});

function animate() {
  if (hasMouse) {
    curX += (mouseX - curX) * 0.08;
    curY += (mouseY - curY) * 0.08;
  } else {
    angle += 0.02;
    const tx = cx + Math.cos(angle) * radius;
    const ty = cy + Math.sin(angle) * radius;
    curX += (tx - curX) * 0.08;
    curY += (ty - curY) * 0.08;
  }
  cursor.style.left = curX + 'px';
  cursor.style.top = curY + 'px';
  requestAnimationFrame(animate);
}
animate();
</script>
</body>
</html>
