<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Expand Card</title>
<style>
*, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
html, body { height: 100%; }
body { min-height: 100%; display: flex; align-items: center; justify-content: center; background: #0a0a0a; overflow: hidden; font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; }

.card {
  width: 200px;
  padding: 1.5rem;
  border-radius: 12px;
  background: #111;
  border: 1px solid #222;
  color: #e2e8f0;
  height: 100px;
  overflow: hidden;
  transition: height 0.4s ease;
  animation: expandCard 3s ease infinite;
}

.card h3 { font-size: 0.95rem; margin-bottom: 0.5rem; }
.card p { font-size: 0.8rem; color: #888; }
.card .extra { font-size: 0.8rem; color: #00ff88; margin-top: 0.75rem; }

.card:hover {
  height: 150px;
}

@keyframes expandCard {
  0%, 35% { height: 100px; }
  50%, 75% { height: 150px; }
  90%, 100% { height: 100px; }
}
</style>
</head>
<body>
<div class="card">
  <h3>Expand Card</h3>
  <p>Hover to reveal</p>
  <div class="extra">More details here...</div>
</div>
</body>
</html>
