<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gradient Border Spin</title>
<style>
*, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
html, body { height: 100%; }
body { min-height: 100%; display: flex; align-items: center; justify-content: center; background: #0a0a0a; overflow: hidden; font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; }

.wrapper {
  position: relative;
  width: 204px;
  padding: 2px;
  border-radius: 12px;
  overflow: hidden;
}

.wrapper::before {
  content: '';
  position: absolute;
  top: -50%;
  left: -50%;
  width: 200%;
  height: 200%;
  background: conic-gradient(#ff0055, #00ff88, #00aaff, #ff00ff, #ffaa00, #ff0055);
  animation: spinGradient 3s linear infinite;
}

@keyframes spinGradient {
  to { transform: rotate(360deg); }
}

.inner {
  position: relative;
  width: 200px;
  padding: 1.5rem;
  border-radius: 10px;
  background: #111;
  color: #e2e8f0;
  z-index: 1;
}

.inner h3 { font-size: 0.95rem; margin-bottom: 0.5rem; }
.inner p { font-size: 0.8rem; color: #888; }
</style>
</head>
<body>
<div class="wrapper">
  <div class="inner">
    <h3>Gradient Border</h3>
    <p>Spinning rainbow edge</p>
  </div>
</div>
</body>
</html>
