<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lift Shadow</title>
<style>
*, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
html, body { height: 100%; }
body { min-height: 100%; display: flex; align-items: center; justify-content: center; background: #0a0a0a; overflow: hidden; font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; }

.card {
  width: 200px;
  min-height: 120px;
  padding: 1.5rem;
  border-radius: 12px;
  background: #111;
  border: 1px solid #222;
  color: #e2e8f0;
  transition: transform 0.3s ease, box-shadow 0.3s ease;
  animation: liftShadow 3s ease infinite;
}

.card h3 { font-size: 0.95rem; margin-bottom: 0.5rem; }
.card p { font-size: 0.8rem; color: #888; }

.card:hover {
  transform: translateY(-4px);
  box-shadow: 0 8px 25px rgba(0, 255, 136, 0.15), 0 4px 10px rgba(0,0,0,0.3);
}

@keyframes liftShadow {
  0%, 35% { transform: translateY(0); box-shadow: 0 0 0 rgba(0,255,136,0); }
  50%, 75% { transform: translateY(-4px); box-shadow: 0 8px 25px rgba(0, 255, 136, 0.15), 0 4px 10px rgba(0,0,0,0.3); }
  90%, 100% { transform: translateY(0); box-shadow: 0 0 0 rgba(0,255,136,0); }
}
</style>
</head>
<body>
<div class="card">
  <h3>Card Title</h3>
  <p>Hover to lift with shadow</p>
</div>
</body>
</html>
