<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dash Animate</title>
<style>
*, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
html, body { height: 100%; }
body { min-height: 100%; display: flex; align-items: center; justify-content: center; background: #0a0a0a; overflow: hidden; font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; }

.card {
  position: relative;
  width: 200px;
  padding: 1.5rem;
  border-radius: 12px;
  background: #111;
  color: #e2e8f0;
}

.card h3 { font-size: 0.95rem; margin-bottom: 0.5rem; }
.card p { font-size: 0.8rem; color: #888; }

.border-svg {
  position: absolute;
  top: 0; left: 0;
  width: 100%;
  height: 100%;
  pointer-events: none;
  overflow: visible;
}

.border-svg rect {
  fill: none;
  stroke: #00ff88;
  stroke-width: 1.5;
  stroke-dasharray: 12 8;
  stroke-linecap: round;
  animation: dashMove 3s linear infinite;
}

@keyframes dashMove {
  to { stroke-dashoffset: -60; }
}
</style>
</head>
<body>
<div class="card" id="card">
  <svg class="border-svg" id="borderSvg"><rect rx="12" ry="12"/></svg>
  <h3>Dashed Border</h3>
  <p>Animated dash pattern</p>
</div>
<script>
function resize() {
  const card = document.getElementById('card');
  const rect = document.querySelector('.border-svg rect');
  rect.setAttribute('x', '0.75');
  rect.setAttribute('y', '0.75');
  rect.setAttribute('width', card.offsetWidth - 1.5);
  rect.setAttribute('height', card.offsetHeight - 1.5);
}
resize();
window.addEventListener('resize', resize);
</script>
</body>
</html>
