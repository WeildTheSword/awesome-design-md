<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fill Slide</title>
<style>
*, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
html, body { height: 100%; }
body { min-height: 100%; display: flex; align-items: center; justify-content: center; background: #0a0a0a; overflow: hidden; font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; }

.btn {
  position: relative;
  padding: 0.8rem 2rem;
  border-radius: 8px;
  background: #111;
  border: 1px solid #333;
  color: #e2e8f0;
  font-weight: 600;
  font-size: 0.9rem;
  cursor: pointer;
  overflow: hidden;
  font-family: inherit;
  transition: color 0.4s;
  z-index: 0;
}

.btn::before {
  content: '';
  position: absolute;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  background: #00ff88;
  transform: translateX(-100%);
  transition: transform 0.4s ease;
  z-index: -1;
  border-radius: 8px;
  animation: fillSlide 3s ease infinite;
}

.btn:hover::before {
  transform: translateX(0);
}

.btn:hover {
  color: #111;
}

@keyframes fillSlide {
  0%, 40% { transform: translateX(-100%); }
  50%, 80% { transform: translateX(0); }
  90%, 100% { transform: translateX(-100%); }
}

.btn { animation: textColor 3s ease infinite; }

@keyframes textColor {
  0%, 40% { color: #e2e8f0; }
  50%, 80% { color: #111; }
  90%, 100% { color: #e2e8f0; }
}
</style>
</head>
<body>
<button class="btn">Hover Me</button>
</body>
</html>
