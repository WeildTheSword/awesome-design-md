<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Glow Border</title>
<style>
  *, *::before, *::after {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }

  body {
    background: #0a0a0a;
    color: #e0e0e0;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 8px;
  }

  @keyframes rotateBorder {
    from { transform: rotate(0deg); }
    to { transform: rotate(360deg); }
  }

  .glow-card {
    position: relative;
    width: 160px;
    border-radius: 10px;
    overflow: hidden;
    padding: 2px;
    background: #222;
    transition: background 0.4s ease;
  }

  .glow-card::before {
    content: '';
    position: absolute;
    top: 50%;
    left: 50%;
    width: 150%;
    height: 150%;
    background: conic-gradient(
      from 0deg,
      #00ff88,
      #3b82f6,
      #a855f7,
      #00ff88
    );
    transform-origin: center;
    transform: translate(-50%, -50%) rotate(0deg);
    opacity: 0;
    transition: opacity 0.4s ease;
    animation: rotateBorder 3s linear infinite;
    animation-play-state: paused;
  }

  .glow-card:hover::before {
    opacity: 1;
    animation-play-state: running;
  }

  .glow-card:hover {
    background: transparent;
  }

  .card-inner {
    position: relative;
    z-index: 1;
    background: #111;
    border-radius: 8px;
    padding: 14px 12px;
  }

  .card-badge {
    display: inline-block;
    padding: 3px 8px;
    font-size: 0.6rem;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    color: #00ff88;
    background: rgba(0, 255, 136, 0.1);
    border-radius: 10px;
    margin-bottom: 8px;
  }

  .card-title {
    font-size: 0.85rem;
    font-weight: 700;
    color: #fff;
    margin-bottom: 6px;
  }

  .card-desc {
    font-size: 0.7rem;
    color: #777;
    line-height: 1.4;
  }
</style>
</head>
<body>
  <div class="glow-card">
    <div class="card-inner">
      <div class="card-badge">Featured</div>
      <div class="card-title">Glow Border</div>
      <div class="card-desc">Hover for rotating gradient glow</div>
    </div>
  </div>
</body>
</html>
