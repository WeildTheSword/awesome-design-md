<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Spotlight Card</title>
<style>
*, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
html, body { height: 100%; }
body { min-height: 100%; display: flex; align-items: center; justify-content: center; background: #0a0a0a; overflow: hidden; font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; }

.card {
  position: relative;
  width: 200px;
  padding: 1.5rem;
  border-radius: 12px;
  background: #111;
  border: 1px solid #222;
  color: #e2e8f0;
  overflow: hidden;
}

.card::before {
  content: '';
  position: absolute;
  top: 0; left: 0;
  width: 100%;
  height: 100%;
  background: radial-gradient(circle 80px at var(--x, 50%) var(--y, 50%), rgba(0,255,136,0.15), transparent);
  opacity: 0;
  transition: opacity 0.3s;
  animation: spotlightMove 3s ease-in-out infinite;
  pointer-events: none;
}

.card h3 { font-size: 0.95rem; margin-bottom: 0.5rem; position: relative; z-index: 1; }
.card p { font-size: 0.8rem; color: #888; position: relative; z-index: 1; }

.card:hover::before {
  opacity: 1;
}

@keyframes spotlightMove {
  0% { --x: 20%; --y: 20%; opacity: 0.8; }
  25% { --x: 80%; --y: 20%; opacity: 0.8; }
  50% { --x: 80%; --y: 80%; opacity: 0.8; }
  75% { --x: 20%; --y: 80%; opacity: 0.8; }
  100% { --x: 20%; --y: 20%; opacity: 0.8; }
}

@property --x {
  syntax: '<percentage>';
  inherits: false;
  initial-value: 50%;
}

@property --y {
  syntax: '<percentage>';
  inherits: false;
  initial-value: 50%;
}
</style>
</head>
<body>
<div class="card">
  <h3>Spotlight</h3>
  <p>Light follows movement</p>
</div>
</body>
</html>
