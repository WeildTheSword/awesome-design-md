<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Button Bounce</title>
<style>
*, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
html, body { height: 100%; }
body { min-height: 100%; display: flex; align-items: center; justify-content: center; background: #0a0a0a; overflow: hidden; font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; }

.btn {
  padding: 0.8rem 2rem;
  border-radius: 8px;
  background: #111;
  border: 1px solid #333;
  color: #e2e8f0;
  font-weight: 600;
  font-size: 0.9rem;
  cursor: pointer;
  font-family: inherit;
  transition: transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
  animation: bounce 3s ease infinite;
}

.btn:hover {
  transform: scale(0.92);
}

@keyframes bounce {
  0%, 35% { transform: scale(1); }
  40% { transform: scale(0.92); }
  50% { transform: scale(1.06); }
  58% { transform: scale(0.98); }
  65%, 100% { transform: scale(1); }
}
</style>
</head>
<body>
<button class="btn">Press Me</button>
</body>
</html>
