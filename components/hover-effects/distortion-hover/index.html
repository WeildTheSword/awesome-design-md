<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Distortion Hover</title>
<style>
*, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
html, body { height: 100%; }
body { min-height: 100%; display: flex; align-items: center; justify-content: center; background: #0a0a0a; overflow: hidden; font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; }

.grid {
  display: grid;
  grid-template-columns: repeat(8, 24px);
  grid-template-rows: repeat(4, 24px);
  gap: 6px;
}

.cell {
  width: 24px;
  height: 24px;
  background: #222;
  border-radius: 4px;
  transition: transform 0.2s ease, background 0.2s ease;
}
</style>
</head>
<body>
<div class="grid" id="grid"></div>
<script>
const grid = document.getElementById('grid');
const cells = [];
const cols = 8, rows = 4;
const cellSize = 24, gap = 6;

for (let r = 0; r < rows; r++) {
  for (let c = 0; c < cols; c++) {
    const cell = document.createElement('div');
    cell.className = 'cell';
    grid.appendChild(cell);
    cells.push({ el: cell, cx: c * (cellSize + gap) + cellSize / 2, cy: r * (cellSize + gap) + cellSize / 2 });
  }
}

let angle = 0;
const gridRect = () => grid.getBoundingClientRect();
let hasMouse = false;
let mouseX = 0, mouseY = 0;

grid.addEventListener('mousemove', (e) => {
  hasMouse = true;
  const rect = gridRect();
  mouseX = e.clientX - rect.left;
  mouseY = e.clientY - rect.top;
});

grid.addEventListener('mouseleave', () => { hasMouse = false; });

function animate() {
  let cx, cy;
  if (hasMouse) {
    cx = mouseX;
    cy = mouseY;
  } else {
    angle += 0.02;
    const gw = cols * (cellSize + gap) - gap;
    const gh = rows * (cellSize + gap) - gap;
    cx = gw / 2 + Math.cos(angle) * gw * 0.35;
    cy = gh / 2 + Math.sin(angle) * gh * 0.35;
  }

  const maxDist = 80;
  for (const cell of cells) {
    const dx = cell.cx - cx;
    const dy = cell.cy - cy;
    const dist = Math.sqrt(dx * dx + dy * dy);
    const scale = dist < maxDist ? 1 + (1 - dist / maxDist) * 0.8 : 1;
    const green = dist < maxDist ? Math.round((1 - dist / maxDist) * 255) : 0;
    cell.el.style.transform = `scale(${scale})`;
    cell.el.style.background = `rgb(${34 + green * 0.1}, ${34 + green}, ${34 + green * 0.5})`;
  }

  requestAnimationFrame(animate);
}
animate();
</script>
</body>
</html>
