<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Flip Card</title>
<style>
*, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
html, body { height: 100%; }
body { min-height: 100%; display: flex; align-items: center; justify-content: center; background: #0a0a0a; overflow: hidden; font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; }

.flip-container {
  width: 200px;
  height: 140px;
  perspective: 600px;
}

.flipper {
  position: relative;
  width: 100%;
  height: 100%;
  transition: transform 0.6s ease;
  transform-style: preserve-3d;
  animation: flipAuto 3s ease infinite;
}

.flip-container:hover .flipper {
  transform: rotateY(180deg);
}

.front, .back {
  position: absolute;
  top: 0; left: 0;
  width: 100%;
  height: 100%;
  backface-visibility: hidden;
  border-radius: 12px;
  background: #111;
  border: 1px solid #222;
  color: #e2e8f0;
  display: flex;
  align-items: center;
  justify-content: center;
  font-weight: 600;
  font-size: 1.1rem;
  padding: 1.5rem;
}

.back {
  transform: rotateY(180deg);
  background: #0d1f15;
  border-color: #00ff88;
  color: #00ff88;
}

@keyframes flipAuto {
  0%, 35% { transform: rotateY(0deg); }
  50%, 80% { transform: rotateY(180deg); }
  95%, 100% { transform: rotateY(0deg); }
}
</style>
</head>
<body>
<div class="flip-container">
  <div class="flipper">
    <div class="front">Front</div>
    <div class="back">Back</div>
  </div>
</div>
</body>
</html>
