<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ripple Click</title>
<style>
*, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
html, body { height: 100%; }
body { min-height: 100%; display: flex; align-items: center; justify-content: center; background: #0a0a0a; overflow: hidden; font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; }

.btn {
  position: relative;
  padding: 0.8rem 2rem;
  border-radius: 8px;
  background: #111;
  border: 1px solid #333;
  color: #e2e8f0;
  font-weight: 600;
  font-size: 0.9rem;
  cursor: pointer;
  overflow: hidden;
  font-family: inherit;
}

.btn .auto-ripple {
  position: absolute;
  top: 50%;
  left: 50%;
  width: 0;
  height: 0;
  border-radius: 50%;
  background: rgba(0, 255, 136, 0.4);
  transform: translate(-50%, -50%);
  animation: autoRipple 3s ease-out infinite;
}

@keyframes autoRipple {
  0%, 50% { width: 0; height: 0; opacity: 0.6; }
  55% { width: 0; height: 0; opacity: 0.6; }
  90% { width: 300px; height: 300px; opacity: 0; }
  100% { width: 300px; height: 300px; opacity: 0; }
}

.btn .click-ripple {
  position: absolute;
  border-radius: 50%;
  background: rgba(0, 255, 136, 0.4);
  transform: translate(-50%, -50%);
  animation: clickRipple 0.6s ease-out forwards;
  pointer-events: none;
}

@keyframes clickRipple {
  0% { width: 0; height: 0; opacity: 0.6; }
  100% { width: 300px; height: 300px; opacity: 0; }
}
</style>
</head>
<body>
<button class="btn">
  Click Me
  <span class="auto-ripple"></span>
</button>
<script>
document.querySelector('.btn').addEventListener('click', function(e) {
  const rect = this.getBoundingClientRect();
  const ripple = document.createElement('span');
  ripple.className = 'click-ripple';
  ripple.style.left = (e.clientX - rect.left) + 'px';
  ripple.style.top = (e.clientY - rect.top) + 'px';
  this.appendChild(ripple);
  ripple.addEventListener('animationend', () => ripple.remove());
});
</script>
</body>
</html>
