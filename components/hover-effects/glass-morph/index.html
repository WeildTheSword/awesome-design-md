<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Glass Morph</title>
<style>
*, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
html, body { height: 100%; }
body { min-height: 100%; display: flex; align-items: center; justify-content: center; background: #0a0a0a; overflow: hidden; font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; }

.bg-blobs {
  position: fixed;
  top: 0; left: 0;
  width: 100%; height: 100%;
  z-index: 0;
}
.blob {
  position: absolute;
  border-radius: 50%;
  filter: blur(40px);
}
.blob-1 { width: 200px; height: 200px; background: #00ff88; top: 20%; left: 30%; opacity: 0.3; }
.blob-2 { width: 150px; height: 150px; background: #ff0088; top: 50%; left: 55%; opacity: 0.3; }

.card {
  position: relative;
  z-index: 1;
  width: 200px;
  padding: 1.5rem;
  border-radius: 12px;
  background: #111;
  border: 1px solid #222;
  color: #e2e8f0;
  transition: all 0.5s ease;
  animation: glassMorph 3s ease infinite;
}

.card h3 { font-size: 0.95rem; margin-bottom: 0.5rem; }
.card p { font-size: 0.8rem; color: #888; }

.card:hover {
  background: rgba(255, 255, 255, 0.08);
  backdrop-filter: blur(10px);
  -webkit-backdrop-filter: blur(10px);
  border-color: rgba(255, 255, 255, 0.15);
}

@keyframes glassMorph {
  0%, 35% { background: #111; backdrop-filter: blur(0px); -webkit-backdrop-filter: blur(0px); border-color: #222; }
  50%, 75% { background: rgba(255,255,255,0.08); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); border-color: rgba(255,255,255,0.15); }
  90%, 100% { background: #111; backdrop-filter: blur(0px); -webkit-backdrop-filter: blur(0px); border-color: #222; }
}
</style>
</head>
<body>
<div class="bg-blobs">
  <div class="blob blob-1"></div>
  <div class="blob blob-2"></div>
</div>
<div class="card">
  <h3>Glass Card</h3>
  <p>Frosted glass effect</p>
</div>
</body>
</html>
