<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Parallax Text</title>
<style>
*, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
body { background: #0a0a0a; color: #e2e8f0; font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; min-height: 500vh; padding: 20px; }
.spacer {
  width: 80%;
  height: 80px;
  background: #111;
  border: 1px solid #222;
  border-radius: 8px;
  margin: 40px auto;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 12px;
}
.parallax-text {
  font-size: 48px;
  font-weight: 900;
  text-align: center;
  color: #1a1a3a;
  letter-spacing: 4px;
  margin: 60px 0;
  will-change: transform;
}
</style>
</head>
<body>
<div class="spacer">Content above</div>
<div class="spacer">Content above</div>
<div class="parallax-text" id="ptext">PARALLAX</div>
<div class="spacer">Content below</div>
<div class="spacer">Content below</div>
<div class="spacer">Content below</div>
<div class="spacer">Content below</div>
<div class="spacer">Content below</div>
<div class="spacer">Content below</div>
<script>
const ptext = document.getElementById('ptext');
const baseOffset = ptext.offsetTop;
window.addEventListener('scroll', () => {
  const scrollY = window.scrollY;
  ptext.style.transform = 'translateY(' + (scrollY * 0.5 - baseOffset * 0.5) + 'px)';
});
</script>
</body>
</html>
