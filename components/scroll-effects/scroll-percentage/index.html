<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Scroll Percentage</title>
<style>
*, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
body { background: #0a0a0a; color: #e2e8f0; font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; min-height: 500vh; padding: 20px; }
.indicator {
  position: fixed;
  bottom: 10px;
  right: 10px;
  width: 50px;
  height: 50px;
  z-index: 100;
}
.indicator svg { transform: rotate(-90deg); }
.indicator circle {
  fill: none;
  stroke-width: 3;
}
.circle-bg { stroke: #222; }
.circle-fg { stroke: #00ff88; stroke-linecap: round; transition: stroke-dashoffset 0.1s linear; }
.pct-text {
  position: absolute;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  font-size: 10px;
  font-weight: 700;
}
.box {
  width: 80%;
  height: 80px;
  background: #111;
  border: 1px solid #222;
  border-radius: 8px;
  margin: 60px auto;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 12px;
}
</style>
</head>
<body>
<div class="indicator">
  <svg width="50" height="50" viewBox="0 0 50 50">
    <circle class="circle-bg" cx="25" cy="25" r="20"/>
    <circle class="circle-fg" id="fg" cx="25" cy="25" r="20" stroke-dasharray="125.66" stroke-dashoffset="125.66"/>
  </svg>
  <div class="pct-text" id="pctText">0%</div>
</div>
<div class="box">Content 1</div><div class="box">Content 2</div><div class="box">Content 3</div>
<div class="box">Content 4</div><div class="box">Content 5</div><div class="box">Content 6</div>
<div class="box">Content 7</div><div class="box">Content 8</div>
<script>
const fg = document.getElementById('fg');
const pctText = document.getElementById('pctText');
const circumference = 2 * Math.PI * 20;
window.addEventListener('scroll', () => {
  const pct = window.scrollY / (document.documentElement.scrollHeight - window.innerHeight);
  const offset = circumference * (1 - Math.min(pct, 1));
  fg.style.strokeDashoffset = offset;
  pctText.textContent = Math.round(pct * 100) + '%';
});
</script>
</body>
</html>
