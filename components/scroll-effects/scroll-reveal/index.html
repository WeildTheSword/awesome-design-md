<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Scroll Reveal</title>
<style>
  *, *::before, *::after {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }

  body {
    background: #0a0a0a;
    color: #e0e0e0;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    line-height: 1.7;
    overflow-x: hidden;
  }

  .scroll-container {
    height: 300vh;
    padding: 20px 24px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 80vh;
    padding-top: 10px;
  }

  .scroll-hint {
    text-align: center;
    color: #444;
    font-size: 0.7rem;
    padding-top: 10px;
  }

  .reveal-box {
    width: 180px;
    height: 40px;
    background: #111;
    border: 1px solid #1e1e1e;
    border-radius: 8px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 0.7rem;
    font-weight: 600;
    color: #555;
    opacity: 0;
    transition: opacity 0.8s ease, transform 0.8s ease;
  }

  .reveal-box--up {
    transform: translateY(40px);
  }

  .reveal-box--left {
    transform: translateX(-40px);
  }

  .reveal-box--right {
    transform: translateX(40px);
  }

  .reveal-box--scale {
    transform: scale(0.85);
  }

  .reveal-box.visible {
    opacity: 1;
    transform: translateY(0) translateX(0) scale(1);
  }

  .reveal-box:nth-child(1) { border-left: 3px solid #00ff88; }
  .reveal-box:nth-child(2) { border-left: 3px solid #3b82f6; }
  .reveal-box:nth-child(3) { border-left: 3px solid #a855f7; }
  .reveal-box:nth-child(4) { border-left: 3px solid #f59e0b; }
  .reveal-box:nth-child(5) { border-left: 3px solid #ef4444; }
</style>
</head>
<body>

  <div class="scroll-hint">Scroll down to reveal</div>

  <div class="scroll-container">
    <div class="reveal-box reveal-box--up">Slide Up</div>
    <div class="reveal-box reveal-box--left">Slide Left</div>
    <div class="reveal-box reveal-box--right">Slide Right</div>
    <div class="reveal-box reveal-box--scale">Scale In</div>
    <div class="reveal-box reveal-box--up">Fade Up</div>
  </div>

<script>
(function() {
  'use strict';

  var observer = new IntersectionObserver(function(entries) {
    entries.forEach(function(entry) {
      if (entry.isIntersecting) {
        entry.target.classList.add('visible');
        observer.unobserve(entry.target);
      }
    });
  }, {
    threshold: 0.15,
    rootMargin: '0px 0px -20px 0px'
  });

  document.querySelectorAll('.reveal-box').forEach(function(el) {
    observer.observe(el);
  });
})();
</script>

</body>
</html>
