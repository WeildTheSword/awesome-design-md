<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Parallax Hero</title>
<style>
  *, *::before, *::after {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }

  body {
    background: #0a0a0a;
    color: #e0e0e0;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    line-height: 1.7;
    overflow-x: hidden;
  }

  .parallax-container {
    position: relative;
    height: 300vh;
  }

  /* Background layer - moves slower */
  .parallax-bg {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100vh;
    z-index: 0;
    will-change: transform;
  }

  .parallax-bg::before {
    content: '';
    position: absolute;
    inset: 0;
    background:
      radial-gradient(ellipse at 20% 50%, rgba(0, 255, 136, 0.06) 0%, transparent 50%),
      radial-gradient(ellipse at 80% 20%, rgba(100, 100, 255, 0.05) 0%, transparent 50%);
  }

  .parallax-bg::after {
    content: '';
    position: absolute;
    inset: 0;
    background-image:
      radial-gradient(1.5px 1.5px at 10% 15%, rgba(255,255,255,0.6), transparent),
      radial-gradient(1px 1px at 25% 35%, rgba(255,255,255,0.4), transparent),
      radial-gradient(2px 2px at 40% 10%, rgba(255,255,255,0.7), transparent),
      radial-gradient(1px 1px at 55% 45%, rgba(255,255,255,0.3), transparent),
      radial-gradient(1.5px 1.5px at 70% 20%, rgba(255,255,255,0.5), transparent),
      radial-gradient(1px 1px at 85% 55%, rgba(255,255,255,0.4), transparent),
      radial-gradient(2px 2px at 48% 70%, rgba(0,255,136,0.5), transparent),
      radial-gradient(1.5px 1.5px at 60% 80%, rgba(100,150,255,0.4), transparent);
  }

  /* Foreground layers at different speeds */
  .layer {
    position: relative;
    z-index: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    height: 100vh;
    text-align: center;
    padding: 16px;
  }

  .layer-1 .label {
    font-size: 1.2rem;
    font-weight: 700;
    color: #fff;
    letter-spacing: -0.02em;
  }

  .layer-1 .label span {
    background: linear-gradient(135deg, #00ff88, #00cc6a);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
  }

  .layer-2 {
    flex-direction: column;
    gap: 12px;
  }

  .layer-2 .tag {
    display: inline-block;
    font-size: 0.65rem;
    font-weight: 600;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: #00ff88;
    padding: 4px 10px;
    border: 1px solid rgba(0, 255, 136, 0.2);
    border-radius: 100px;
  }

  .layer-2 .text {
    font-size: 0.85rem;
    color: #666;
    max-width: 280px;
  }

  .layer-3 {
    gap: 12px;
  }

  .stat-box {
    background: #111;
    border: 1px solid #1e1e1e;
    border-radius: 10px;
    padding: 14px 18px;
    text-align: center;
  }

  .stat-box .number {
    font-size: 1.1rem;
    font-weight: 800;
    color: #00ff88;
    display: block;
  }

  .stat-box .label {
    font-size: 0.6rem;
    color: #555;
    text-transform: uppercase;
    letter-spacing: 0.08em;
  }
</style>
</head>
<body>
  <div class="parallax-container">
    <div class="parallax-bg" id="parallaxBg"></div>

    <div class="layer layer-1">
      <div class="label">Explore the <span>Depth</span></div>
    </div>

    <div class="layer layer-2">
      <div class="tag">Parallax</div>
      <div class="text">Background drifts at a different speed, creating depth and immersion.</div>
    </div>

    <div class="layer layer-3">
      <div class="stat-box">
        <span class="number">0</span>
        <span class="label">Deps</span>
      </div>
      <div class="stat-box">
        <span class="number">60</span>
        <span class="label">FPS</span>
      </div>
      <div class="stat-box">
        <span class="number">&lt;1kb</span>
        <span class="label">JS</span>
      </div>
    </div>
  </div>

<script>
(function() {
  'use strict';

  var bg = document.getElementById('parallaxBg');
  var ticking = false;
  var lastScrollY = 0;
  var parallaxSpeed = 0.4;

  function updateParallax() {
    var offset = lastScrollY * parallaxSpeed;
    bg.style.transform = 'translate3d(0,' + offset + 'px,0)';
    ticking = false;
  }

  function onScroll() {
    lastScrollY = window.pageYOffset || document.documentElement.scrollTop;
    if (!ticking) {
      requestAnimationFrame(updateParallax);
      ticking = true;
    }
  }

  window.addEventListener('scroll', onScroll, { passive: true });
})();
</script>

</body>
</html>
