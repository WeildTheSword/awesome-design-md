<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sticky Header</title>
<style>
*, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
body { background: #0a0a0a; color: #e2e8f0; font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; min-height: 500vh; }
.header {
  position: sticky;
  top: 0;
  z-index: 10;
  background: #111;
  border-bottom: 1px solid #222;
  height: 60px;
  display: flex;
  align-items: center;
  padding: 0 15px;
  font-size: 16px;
  font-weight: 700;
  transition: height 0.3s ease, font-size 0.3s ease;
}
.header.shrunk {
  height: 40px;
  font-size: 12px;
}
.content { padding: 20px; }
.box {
  width: 90%;
  height: 80px;
  background: #111;
  border: 1px solid #222;
  border-radius: 8px;
  margin: 30px auto;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 12px;
}
</style>
</head>
<body>
<div class="header" id="header">Sticky Header</div>
<div class="content">
  <div class="box">Section 1</div><div class="box">Section 2</div><div class="box">Section 3</div>
  <div class="box">Section 4</div><div class="box">Section 5</div><div class="box">Section 6</div>
  <div class="box">Section 7</div><div class="box">Section 8</div>
</div>
<script>
const header = document.getElementById('header');
window.addEventListener('scroll', () => {
  header.classList.toggle('shrunk', window.scrollY > 30);
});
</script>
</body>
</html>
