<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Scroll Progress Bar</title>
<style>
*, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
body { background: #0a0a0a; color: #e2e8f0; font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; min-height: 500vh; padding: 20px; }
.progress-bar {
  position: fixed;
  top: 0;
  left: 0;
  height: 3px;
  background: #00ff88;
  width: 0%;
  z-index: 100;
  transition: width 0.05s linear;
}
.box {
  width: 80%;
  height: 80px;
  background: #111;
  border: 1px solid #222;
  border-radius: 8px;
  margin: 60px auto;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 12px;
}
</style>
</head>
<body>
<div class="progress-bar" id="progressBar"></div>
<div class="box">Content 1</div>
<div class="box">Content 2</div>
<div class="box">Content 3</div>
<div class="box">Content 4</div>
<div class="box">Content 5</div>
<div class="box">Content 6</div>
<div class="box">Content 7</div>
<div class="box">Content 8</div>
<script>
const bar = document.getElementById('progressBar');
window.addEventListener('scroll', () => {
  const scrollTop = window.scrollY;
  const docHeight = document.documentElement.scrollHeight - window.innerHeight;
  const pct = docHeight > 0 ? (scrollTop / docHeight) * 100 : 0;
  bar.style.width = pct + '%';
});
</script>
</body>
</html>
