<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Horizontal Scroll</title>
<style>
*, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
body { background: #0a0a0a; color: #e2e8f0; font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; }
.spacer { height: 60vh; display: flex; align-items: center; justify-content: center; font-size: 13px; }
.h-section { height: 400vh; position: relative; }
.h-sticky {
  position: sticky;
  top: 0;
  height: 100vh;
  overflow: hidden;
  display: flex;
  align-items: center;
}
.h-track {
  display: flex;
  gap: 15px;
  padding: 0 20px;
  will-change: transform;
}
.h-card {
  min-width: 150px;
  height: 80px;
  background: #111;
  border: 1px solid #222;
  border-radius: 8px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 12px;
  flex-shrink: 0;
}
</style>
</head>
<body>
<div class="spacer">Scroll down for horizontal content</div>
<div class="h-section" id="hSection">
  <div class="h-sticky">
    <div class="h-track" id="hTrack">
      <div class="h-card">Card 1</div><div class="h-card">Card 2</div><div class="h-card">Card 3</div>
      <div class="h-card">Card 4</div><div class="h-card">Card 5</div><div class="h-card">Card 6</div>
      <div class="h-card">Card 7</div><div class="h-card">Card 8</div>
    </div>
  </div>
</div>
<div class="spacer">End</div>
<script>
const hSection = document.getElementById('hSection');
const hTrack = document.getElementById('hTrack');
window.addEventListener('scroll', () => {
  const rect = hSection.getBoundingClientRect();
  const scrollRange = rect.height - window.innerHeight;
  const progress = Math.max(0, Math.min(1, -rect.top / scrollRange));
  const maxShift = hTrack.scrollWidth - window.innerWidth + 40;
  hTrack.style.transform = 'translateX(' + (-progress * maxShift) + 'px)';
});
</script>
</body>
</html>
