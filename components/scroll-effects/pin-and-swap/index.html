<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pin and Swap</title>
<style>
*, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
body { background: #0a0a0a; color: #e2e8f0; font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; }
.spacer { height: 100vh; display: flex; align-items: center; justify-content: center; font-size: 13px; }
.pin-section { height: 400vh; position: relative; }
.pin-container {
  position: sticky;
  top: 0;
  height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
}
.slide {
  position: absolute;
  width: 80%;
  height: 80px;
  background: #111;
  border: 1px solid #222;
  border-radius: 8px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 14px;
  opacity: 0;
  transition: opacity 0.4s ease;
}
.slide.active { opacity: 1; }
</style>
</head>
<body>
<div class="spacer">Scroll down</div>
<div class="pin-section" id="pinSection">
  <div class="pin-container">
    <div class="slide active" data-slide="0">Slide 1</div>
    <div class="slide" data-slide="1">Slide 2</div>
    <div class="slide" data-slide="2">Slide 3</div>
  </div>
</div>
<div class="spacer">End</div>
<script>
const pinSection = document.getElementById('pinSection');
const slides = document.querySelectorAll('.slide');
window.addEventListener('scroll', () => {
  const rect = pinSection.getBoundingClientRect();
  const progress = Math.max(0, Math.min(1, -rect.top / (rect.height - window.innerHeight)));
  const idx = Math.min(2, Math.floor(progress * 3));
  slides.forEach((s, i) => s.classList.toggle('active', i === idx));
});
</script>
</body>
</html>
