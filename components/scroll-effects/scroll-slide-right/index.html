<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Scroll Slide Right</title>
<style>
*, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
body { background: #0a0a0a; color: #e2e8f0; font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; min-height: 400vh; padding: 20px; }
.box {
  width: 80%;
  height: 100px;
  background: #111;
  border: 1px solid #222;
  border-radius: 8px;
  margin: 80px auto;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 14px;
  opacity: 0;
  transform: translateX(50px);
  transition: opacity 0.6s ease, transform 0.6s ease;
}
.box.visible { opacity: 1; transform: translateX(0); }
</style>
</head>
<body>
<div class="box">Slide Right 1</div>
<div class="box">Slide Right 2</div>
<div class="box">Slide Right 3</div>
<div class="box">Slide Right 4</div>
<div class="box">Slide Right 5</div>
<div class="box">Slide Right 6</div>
<script>
const observer = new IntersectionObserver((entries) => {
  entries.forEach(e => { if (e.isIntersecting) e.target.classList.add('visible'); });
}, { threshold: 0.2 });
document.querySelectorAll('.box').forEach(b => observer.observe(b));
</script>
</body>
</html>
